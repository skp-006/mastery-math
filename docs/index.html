addUnits("g7",[["g7nsx","Rational Number Extensions"],["g7rpx","Percents, Scale & Proportion Applications"],["g7eex","Equations & Expressions (cont.)"],["g7geo","Geometry: Angles, Area & Volume"],["g7sp","Statistics & Probability"]]);
const DS=[2,4,5,8,10,20,25];
T("abs-opp","g7nsx","7.NS.1","Absolute value & opposites",["int-addsub"],
 "The absolute value of a number is its distance from 0 on the number line, so it is never negative. The opposite of a number is the number on the other side of 0 the same distance away.",
 ["|a| is the distance from a to 0: |−7| = 7 and |7| = 7.","The opposite of a is −a. The opposite of −4 is 4.","The distance between a and b on a number line is |a − b|."],
 [()=>{const a=rnz(-25,25);return mk("num",`Evaluate: |${a}|`,Math.abs(a),"Absolute value is distance from 0, so drop the sign.",`|${a}| = ${Math.abs(a)}`,{js:`Math.abs(${a})`})},
  ()=>{const a=rnz(-15,15),b=rnz(-15,15);return mk("num",`Evaluate: |${a}| - |${b}|`,Math.abs(a)-Math.abs(b),"Find each absolute value first, then subtract.",`${Math.abs(a)} - ${Math.abs(b)} = ${Math.abs(a)-Math.abs(b)}`,{js:`Math.abs(${a})-Math.abs(${b})`})},
  ()=>{const a=rnz(-20,20);let b;do{b=rnz(-20,20)}while(b===a);return mk("num",`How far apart are ${a} and ${b} on the number line?`,Math.abs(a-b),"Distance = |a − b|.",`|${a} - ${P(b)}| = |${a-b}| = ${Math.abs(a-b)}`,{js:`Math.abs(${a}-(${b}))`})},
  ()=>{const a=rnz(-20,20);return mk("num",`Evaluate: -|${a}|`,-Math.abs(a),"Take the absolute value first, then apply the negative sign.",`|${a}| = ${Math.abs(a)}, so -|${a}| = ${-Math.abs(a)}`,{js:`-Math.abs(${a})`})}]);
T("frac-dec","g7nsx","7.NS.2d","Fractions, decimals & percents",["frac-muldiv","dec-ops"],
 "Every fraction can be written as a decimal by dividing the numerator by the denominator, and as a percent by multiplying that decimal by 100.",
 ["a/b = a ÷ b: 3/8 = 0.375.","A decimal with k places is a fraction over 10ᵏ: 0.45 = 45/100 = 9/20 — reduce!","Percent means per 100: multiply a decimal by 100 to get a percent."],
 [()=>{const d=pick(DS),n=ri(1,3*d);return mk("num",`Write ${n}/${d} as a decimal.`,rdn(n/d,4),"Divide the numerator by the denominator.",`${n} ÷ ${d} = ${rdn(n/d,4)}`,{js:`${n}/${d}`})},
  ()=>{const d=pick(DS);let n;do{n=ri(1,d-1)}while(gcd(n,d)!==1);return mk("num",`Write ${rdn(n/d,4)} as a fraction in lowest terms.`,`${n}/${d}`,"Put the decimal over a power of 10 and reduce.",`${rdn(n/d,4)} = ${n}/${d} in lowest terms`,{js:`${n}/${d}`})},
  ()=>{const d=ri(3,9),w=ri(1,6);let n;do{n=ri(1,d-1)}while(gcd(n,d)!==1);return mk("num",`Write ${w} ${n}/${d} as an improper fraction.`,`${w*d+n}/${d}`,"Multiply the whole number by the denominator and add the numerator.",`${w}×${d} + ${n} = ${w*d+n}, so ${w*d+n}/${d}`,{js:`${w}+${n}/${d}`})},
  ()=>{const d=pick([2,4,5,8,10,20,25,50]),n=ri(1,d-1);return mk("num",`Write ${n}/${d} as a percent.`,rdn(100*n/d,3),"Convert to a decimal, then multiply by 100.",`${n}/${d} = ${rdn(n/d,5)}; × 100 = ${rdn(100*n/d,3)}%`,{u:"%",js:`${n}/${d}*100`})}]);
T("rat-word","g7nsx","7.NS.3","Rational-number word problems",["frac-addsub","dec-ops","abs-opp"],
 "Real situations — temperatures, bank balances, elevations — use positive and negative rational numbers. Translate the words into an expression, then evaluate.",
 ["Gains, deposits and rises are positive; losses, withdrawals and drops are negative.","Change = final − start.","Use fractions or decimals consistently and check that the sign makes sense."],
 [()=>{const a=rnz(-12,10),b=rnz(-12,10);return mk("num",`An elevation changes from ${a} m to ${b} m (relative to sea level). What is the change in elevation (final − start)?`,b-a,"Change = final − start.",`${b} - ${P(a)} = ${b-a}`,{js:`${b}-(${a})`,u:" m"})},
  ()=>{const b=ri(20,90),w=ri(5,40),d=ri(5,50);return mk("num",`A bank account has $${b}. You withdraw $${w} and then deposit $${d}. What is the new balance?`,b-w+d,"Withdrawals subtract; deposits add.",`${b} - ${w} + ${d} = ${b-w+d}`,{js:`${b}-${w}+${d}`})},
  ()=>{const t=ri(-9,4)*2,rate=ri(2,4),h=ri(2,5);return mk("num",`The temperature is ${t}°F and falls ${rate}°F each hour. What is the temperature after ${h} hours?`,t-rate*h,"Falling is repeated subtraction: start − rate × time.",`${t} - ${rate}×${h} = ${t-rate*h}`,{js:`${t}-${rate}*${h}`})},
  ()=>{const a=ri(1,9),b=ri(1,9),c=ri(2,9),d=ri(2,9);const n=a*d-b*c;return mk("num",`A recipe uses ${a}/${c} cup of oil and then ${b}/${d} cup is removed. How much is left? (Compute ${a}/${c} - ${b}/${d})`,frs(n,c*d),"Use a common denominator, then subtract.",`${a*d}/${c*d} - ${b*c}/${c*d} = ${frs(n,c*d)}`,{js:`${a}/${c}-${b}/${d}`})}]);
T("prop-rel","g7rpx","7.RP.2","Proportional relationships",["prop-solve"],
 "Two quantities are proportional when their ratio y/x is always the same number k, the constant of proportionality. The equation is y = kx.",
 ["In a table, k = y ÷ x for every row (they must all agree).","y = kx: to find y multiply x by k; to find x divide y by k.","k is the unit rate: the amount of y for 1 unit of x."],
 [()=>{const p=ri(1,9),q=ri(1,4);const xs=[1,2,3].map(i=>q*i),ys=[1,2,3].map(i=>p*i);return mk("num",`A table shows x = ${xs.join(", ")} and y = ${ys.join(", ")}. What is the constant of proportionality k (y = kx)?`,frs(p,q),"k = y ÷ x.",`${ys[0]}/${xs[0]} = ${frs(p,q)}`,{js:`${p}/${q}`})},
  ()=>{const k=ri(2,9),a=ri(2,6),c=ri(7,15);return mk("num",`y is proportional to x. When x = ${a}, y = ${k*a}. What is y when x = ${c}?`,k*c,"Find k = y ÷ x, then y = kx.",`k = ${k*a}/${a} = ${k}; y = ${k}×${c} = ${k*c}`,{js:`${k*a}/${a}*${c}`})},
  ()=>{const k=pick([1.5,2.5,3.5,0.75,1.25,4.5]),x=ri(2,12);return mk("num",`Apples cost $${k} per pound, so the cost is y = ${k}x. What is the cost of ${x} pounds?`,rdn(k*x,3),"Substitute x into y = kx.",`y = ${k}×${x} = ${rdn(k*x,3)}`,{js:`${k}*${x}`,u:" dollars"})},
  ()=>{const mph=ri(3,9)*5,h=ri(2,6),h2=ri(7,12);return mk("num",`A car travels ${mph*h} miles in ${h} hours at a constant speed. How many miles does it travel in ${h2} hours?`,mph*h2,"Unit rate = distance ÷ time; then multiply by the new time.",`rate = ${mph*h}/${h} = ${mph} mph; ${mph}×${h2} = ${mph*h2}`,{js:`${mph*h}/${h}*${h2}`})}]);
T("pct-apps","g7rpx","7.RP.3","Discounts, tax, tips & markups",["percent","prop-rel"],
 "Percent problems change a price by a percent of itself. Convert the percent to a decimal multiplier to do it in one step.",
 ["Discount d%: new price = price × (1 − d/100). Tax or markup m%: price × (1 + m/100).","A tip is just a percent of the bill: tip = bill × rate.","To find an original price from a sale price, divide by the multiplier."],
 [()=>{const p=ri(4,40)*5,d=pick([10,15,20,25,30,40,50]);return mk("num",`A jacket costs $${p} and is on sale for ${d}% off. What is the sale price (in dollars)?`,rdn(p*(100-d)/100,2),"Multiply by (1 − discount).",`${p} × ${(100-d)/100} = ${rdn(p*(100-d)/100,2)}`,{js:`${p}*(1-${d}/100)`})},
  ()=>{const p=ri(4,40)*5,t=pick([5,6,7,8]);return mk("num",`An item costs $${p} before ${t}% sales tax. What is the total cost with tax (in dollars)?`,rdn(p*(100+t)/100,2),"Multiply by (1 + tax rate).",`${p} × ${(100+t)/100} = ${rdn(p*(100+t)/100,2)}`,{js:`${p}*(1+${t}/100)`})},
  ()=>{const b=ri(2,20)*4,r=pick([15,20,25]);return mk("num",`Your restaurant bill is $${b}. How much is a ${r}% tip (in dollars)?`,rdn(b*r/100,2),"Tip = bill × rate.",`${b} × ${r/100} = ${rdn(b*r/100,2)}`,{js:`${b}*${r}/100`})},
  ()=>{const w=ri(2,30)*2,m=pick([20,25,50,75,100]);return mk("num",`A store buys a toy for $${w} and marks it up ${m}%. What is the selling price (in dollars)?`,rdn(w*(100+m)/100,2),"Selling price = cost × (1 + markup).",`${w} × ${(100+m)/100} = ${rdn(w*(100+m)/100,2)}`,{js:`${w}*(1+${m}/100)`})},
  ()=>{const d=pick([10,20,25,50]),o=ri(2,10)*20,s=o*(100-d)/100;return mk("num",`After a ${d}% discount, a bike costs $${s}. What was the original price (in dollars)?`,o,"Sale price = original × (1 − d); divide to undo it.",`${s} ÷ ${(100-d)/100} = ${o}`,{js:`${s}/(1-${d}/100)`})}]);
T("pct-change","g7rpx","7.RP.3","Percent change & simple interest",["pct-apps"],
 "Percent change compares the change in a quantity to its original amount. Simple interest is earned only on the starting amount.",
 ["Percent change = (new − old) ÷ old × 100. Positive is an increase, negative a decrease.","Simple interest: I = P·r·t (rate as a decimal, t in years).","Percent error = |measured − actual| ÷ actual × 100."],
 [()=>{const o=pick([20,25,40,50,80,100,200]),p=pick([10,20,25,50,75]);const n=o*(100+p)/100;return mk("num",`A price rises from $${o} to $${n}. What is the percent increase?`,p,"Percent change = change ÷ original × 100.",`(${n} - ${o})/${o} = ${n-o}/${o} = ${p/100}`,{u:"%",js:`(${n}-${o})/${o}*100`})},
  ()=>{const o=pick([20,25,40,50,80,100,200]),p=pick([10,20,25,50,75]);const n=o*(100-p)/100;return mk("num",`A population drops from ${o} to ${n}. What is the percent decrease?`,p,"Percent decrease = (old − new) ÷ old × 100.",`(${o} - ${n})/${o} = ${o-n}/${o} = ${p/100}`,{u:"%",js:`(${o}-${n})/${o}*100`})},
  ()=>{const P_=ri(5,50)*100,r=ri(2,8),t=ri(1,6);return mk("num",`How much simple interest is earned on $${P_} at ${r}% per year for ${t} years (in dollars)?`,P_*r*t/100,"I = P × r × t.",`${P_} × ${r/100} × ${t} = ${P_*r*t/100}`,{js:`${P_}*${r}/100*${t}`})},
  ()=>{const A=pick([20,25,40,50,80,100,200]),e=ri(1,6);return mk("num",`A scale reads ${A+e} lb for an object that actually weighs ${A} lb. What is the percent error?`,rdn(e*100/A,3),"Percent error = |measured − actual| ÷ actual × 100.",`${e}/${A} × 100 = ${rdn(e*100/A,3)}`,{u:"%",js:`Math.abs(${A+e}-${A})/${A}*100`})},
  ()=>{const P_=ri(5,40)*100,r=ri(2,6),t=ri(2,5);return mk("num",`You deposit $${P_} at ${r}% simple interest per year. What is the total balance after ${t} years (in dollars)?`,P_+P_*r*t/100,"Balance = P + P·r·t.",`${P_} + ${P_*r*t/100} = ${P_+P_*r*t/100}`,{js:`${P_}*(1+${r}/100*${t})`})}]);
T("scale-draw","g7rpx","7.G.1","Scale drawings",["prop-solve","dec-ops"],
 "A scale drawing is the same shape as the real object, with every length multiplied by the same scale factor.",
 ["Write the scale as a ratio, e.g. 1 cm : 5 m, and set up a proportion.","Lengths scale by k; areas scale by k²; volumes by k³.","Keep units consistent."],
 [()=>{const k=ri(2,12),L=pick([2,3,4,5,6.5,7.5,2.5]);return mk("num",`On a scale drawing, 1 cm represents ${k} m. A wall is ${L} cm long on the drawing. How long is the real wall (m)?`,rdn(k*L,3),"Multiply the drawing length by the scale.",`${L} × ${k} = ${rdn(k*L,3)}`,{js:`${k}*${L}`,u:" m"})},
  ()=>{const k=ri(2,10),L=ri(2,12);return mk("num",`A room is ${k*L} m long. On a drawing where 1 cm represents ${k} m, how many cm long is it?`,L,"Divide the real length by the scale.",`${k*L} ÷ ${k} = ${L}`,{js:`${k*L}/${k}`,u:" cm"})},
  ()=>{const k=ri(5,50),d=pick([1.5,2,2.5,3,3.5,4,4.5]);return mk("num",`On a map, 1 inch represents ${k} miles. Two cities are ${d} inches apart. What is the real distance (miles)?`,rdn(k*d,3),"Multiply the map distance by the scale.",`${d} × ${k} = ${rdn(k*d,3)}`,{js:`${k}*${d}`,u:" miles"})},
  ()=>{const k=ri(2,6),A=ri(2,9);return mk("num",`A drawing is made at scale 1 : ${k}. A shape on the drawing has area ${A} cm². What is the area of the real shape (cm²)?`,A*k*k,"Areas scale by the square of the scale factor.",`${A} × ${k}² = ${A*k*k}`,{js:`${A}*${k}**2`})}]);
T("distrib","g7eex","7.EE.1","Distributive property & factoring out a GCF",["expr-simplify"],
 "The distributive property says a(b + c) = ab + ac. Read right to left, it lets you factor a common factor out of an expression.",
 ["Expand: multiply the outside factor by every term inside, watching signs: −3(2x − 5) = −6x + 15.","Factor: find the greatest common factor of all terms and write it outside parentheses: 6x + 9 = 3(2x + 3).","Check by expanding your answer — you should get the original back."],
 [()=>{const a=rnz(2,9),b=rnz(-7,7),c=rnz(-9,9);return mk("poly",`Expand: ${a}(${lin(b,c)})`,polyStr([[a*b,"x"],[a*c,""]]),"Multiply the outside number by each term inside.",`${a}·${P(b)}x = ${a*b}x; ${a}·${P(c)} = ${a*c}`,{pe:`${a}*(${b}*x+(${c}))`})},
  ()=>{const a=-ri(2,9),b=rnz(-7,7),c=rnz(-9,9);return mk("poly",`Expand: ${a}(${lin(b,c)})`,polyStr([[a*b,"x"],[a*c,""]]),"Distribute the negative number to each term; signs flip.",`${P(a)}·${P(b)}x = ${a*b}x; ${P(a)}·${P(c)} = ${a*c}`,{pe:`(${a})*(${b}*x+(${c}))`})},
  ()=>{const g=ri(2,9);let p,q;do{p=ri(1,6);q=rnz(-9,9)}while(gcd(p,q)!==1);return mk("expr",`Factor out the greatest common factor: ${lin(g*p,g*q)}`,`${g}(${lin(p,q)})`,"Find the GCF of the coefficients, write it outside, and divide each term by it.",`GCF = ${g}; ${g*p}x ÷ ${g} = ${cf(p,"x")}; ${g*q} ÷ ${g} = ${q}`,{form:"factor",fdeg:[1],pe:`${g*p}*x+(${g*q})`})},
  ()=>{const a=ri(2,6),b=rnz(-6,6),c=ri(2,6),d=rnz(-6,6);return mk("poly",`Simplify: ${a}(${lin(1,b)}) - ${c}(${lin(1,d)})`.replace(/\(x\)/,"x"),polyStr([[a-c,"x"],[a*b-c*d,""]]),"Distribute each product, then combine like terms.",`${a}x ${P(a*b)} − ${c}x ${P(c*d)} ⇒ ${a-c}x + ${a*b-c*d}`,{pe:`${a}*(x+(${b}))-${c}*(x+(${d}))`})}]);
T("eq-paren","g7eex","7.EE.4a","Equations with parentheses & fractions",["twostep-eq","distrib"],
 "To solve an equation with parentheses or a fraction, first remove them (distribute or multiply by the denominator), then solve the resulting two-step equation.",
 ["Distribute first: 3(x + 2) = 15 → 3x + 6 = 15.","Or divide both sides by the outside factor when it divides evenly: x + 2 = 5.","For x/4 + 3 = 8, undo the +3 first, then multiply both sides by 4."],
 [()=>{const x0=rnz(-9,9),p=ri(2,6),q=rnz(-8,8),r=p*(x0+q);return mk("num",`Solve for x: ${p}(x + ${q}) = ${r}`,x0,"Distribute (or divide by the outside factor), then solve.",`${p}x + ${p*q} = ${r} ⇒ ${p}x = ${r-p*q} ⇒ x = ${x0}`,{eqs:[`${p}*(x+(${q}))=${r}`]})},
  ()=>{const x0=rnz(-8,8),p=ri(2,5),a=rnz(-5,5),b=rnz(-9,9),r=p*(a*x0+b);return mk("num",`Solve for x: ${p}(${lin(a,b)}) = ${r}`,x0,"Distribute, then use inverse operations.",`${p*a}x + ${p*b} = ${r} ⇒ ${p*a}x = ${r-p*b} ⇒ x = ${x0}`,{eqs:[`${p}*(${a}*x+(${b}))=${r}`]})},
  ()=>{const a=ri(2,8),x0=a*rnz(-6,6),b=rnz(-9,9),c=x0/a+b;return mk("num",`Solve for x: x/${a} + ${b} = ${c}`.replace("+ -","- "),x0,"Undo the addition, then multiply both sides by the denominator.",`x/${a} = ${c-b} ⇒ x = ${a}×${c-b} = ${x0}`,{eqs:[`x/${a}+(${b})=${c}`]})},
  ()=>{const p=ri(2,6),x0=rnz(-9,9),q=rnz(-9,9),r=(x0+q)/p;if(!Number.isInteger(r))return TOPIC_BY_ID["eq-paren"]?TOPIC_BY_ID["eq-paren"].gens[3]():mk("num","x",0,"","");return mk("num",`Solve for x: (x + ${q})/${p} = ${r}`.replace("+ -","- "),x0,"Multiply both sides by the denominator, then isolate x.",`x + ${q} = ${r*p} ⇒ x = ${x0}`,{eqs:[`(x+(${q}))/${p}=${r}`]})}]);
T("angle-rel","g7geo","7.G.5","Angle relationships",["twostep-eq"],
 "Pairs of angles can be related: complementary angles add to 90°, supplementary angles add to 180°, vertical angles are equal, and the angles around a point add to 360°.",
 ["Complementary: a + b = 90°.   Supplementary (a straight line): a + b = 180°.","Vertical angles (opposite angles where two lines cross) are equal.","Angles around a point total 360°. Use an equation when the angles contain x."],
 [()=>{const a=ri(5,85);return mk("num",`What is the complement of a ${a}° angle?`,90-a,"Complementary angles add to 90°.",`90 - ${a} = ${90-a}`,{js:`90-${a}`,u:"°"})},
  ()=>{const a=ri(5,175);return mk("num",`What is the supplement of a ${a}° angle?`,180-a,"Supplementary angles add to 180°.",`180 - ${a} = ${180-a}`,{js:`180-${a}`,u:"°"})},
  ()=>{const x0=ri(4,20),a=ri(2,5);let c;do{c=ri(1,6)}while(c===a);const b=ri(0,20),d=(a-c)*x0+b;if(d<0)return TOPIC_BY_ID["angle-rel"].gens[2]();return mk("num",`Two vertical angles measure (${lin(a,b)})° and (${lin(c,d)})°. Find x.`,x0,"Vertical angles are equal: set the expressions equal.",`${lin(a,b)} = ${lin(c,d)} ⇒ ${a-c}x = ${d-b} ⇒ x = ${x0}`,{eqs:[`${a}*x+${b}=${c}*x+${d}`]})},
  ()=>{let x0,a,c,b,d;do{x0=ri(5,20);a=ri(1,5);c=ri(1,5);b=ri(0,30);d=180-(a+c)*x0-b}while(d<0);return mk("num",`Two angles that form a straight line measure (${lin(a,b)})° and (${lin(c,d)})°. Find x.`,x0,"They are supplementary: the sum is 180°.",`${lin(a,b)} + ${lin(c,d)} = 180 ⇒ ${a+c}x = ${180-b-d} ⇒ x = ${x0}`,{eqs:[`${a}*x+${b}+${c}*x+${d}=180`]})},
  ()=>{const a=ri(40,120),b=ri(40,120),c=ri(30,100);if(a+b+c>=360)return TOPIC_BY_ID["angle-rel"].gens[4]();return mk("num",`Three angles around a point measure ${a}°, ${b}° and ${c}° with a fourth angle. Find the fourth angle.`,360-a-b-c,"Angles around a point add to 360°.",`360 - (${a}+${b}+${c}) = ${360-a-b-c}`,{js:`360-${a+b+c}`,u:"°"})}]);
T("tri-angles","g7geo","8.G.5","Triangle angle sum & exterior angles",["angle-rel"],
 "The three interior angles of any triangle add to 180°. An exterior angle equals the sum of the two remote interior angles.",
 ["Interior angles: A + B + C = 180°.","Isosceles triangle: the two base angles are equal; equilateral: all 60°.","Exterior angle = sum of the two interior angles not next to it."],
 [()=>{const a=ri(20,80),b=ri(20,90);return mk("num",`Two angles of a triangle are ${a}° and ${b}°. Find the third angle.`,180-a-b,"Interior angles of a triangle add to 180°.",`180 - ${a} - ${b} = ${180-a-b}`,{js:`180-${a}-${b}`,u:"°"})},
  ()=>{const base=ri(20,80);return mk("num",`An isosceles triangle has a vertex angle of ${180-2*base}°. What is each base angle?`,base,"The base angles are equal and all three angles total 180°.",`(180 - ${180-2*base}) ÷ 2 = ${base}`,{js:`(180-${180-2*base})/2`,u:"°"})},
  ()=>{const a=ri(25,80),b=ri(25,90);return mk("num",`Two remote interior angles of a triangle measure ${a}° and ${b}°. What is the exterior angle next to the third angle?`,a+b,"Exterior angle = sum of the remote interior angles.",`${a} + ${b} = ${a+b}`,{js:`${a}+${b}`,u:"°"})},
  ()=>{const x0=ri(20,40),p=ri(5,30),q=180-3*x0-p;return mk("num",`The angles of a triangle measure x°, (x + ${p})° and (x + ${q})°. Find x.`,x0,"Set the sum of the angles equal to 180.",`3x + ${p+q} = 180 ⇒ x = ${x0}`,{eqs:[`x+(x+${p})+(x+${q})=180`]})}]);
T("area-2d","g7geo","7.G.6","Area of triangles, quadrilaterals & composite figures",["frac-muldiv","dec-ops"],
 "Area measures the surface inside a shape in square units. Break complicated shapes into rectangles and triangles.",
 ["Triangle: A = ½·b·h. Parallelogram: A = b·h. Trapezoid: A = ½(b₁ + b₂)·h.","Height is perpendicular to the base.","Composite figure: add the areas of the pieces, or subtract a removed piece."],
 [()=>{const b=ri(3,20),h=ri(2,16);return mk("num",`Find the area of a triangle with base ${b} and height ${h}.`,rdn(b*h/2,2),"A = ½ b h.",`½ × ${b} × ${h} = ${rdn(b*h/2,2)}`,{js:`0.5*${b}*${h}`})},
  ()=>{const b1=ri(3,12),b2=ri(3,12),h=ri(2,10);return mk("num",`A trapezoid has parallel sides ${b1} and ${b2} and height ${h}. Find its area.`,rdn((b1+b2)*h/2,2),"A = ½(b₁ + b₂)h.",`½(${b1}+${b2})×${h} = ${rdn((b1+b2)*h/2,2)}`,{js:`(${b1}+${b2})*${h}/2`})},
  ()=>{const b=ri(3,15),h=ri(2,12);return mk("num",`A parallelogram has base ${b} and height ${h}. Find its area.`,b*h,"A = b × h.",`${b} × ${h} = ${b*h}`,{js:`${b}*${h}`})},
  ()=>{const a=ri(8,16),b=ri(8,16),c=ri(2,6),d=ri(2,6);return mk("num",`An L-shaped figure is a ${a} by ${b} rectangle with a ${c} by ${d} corner removed. Find its area.`,a*b-c*d,"Area = whole rectangle − removed piece.",`${a}×${b} - ${c}×${d} = ${a*b-c*d}`,{js:`${a}*${b}-${c}*${d}`})},
  ()=>{const b=ri(3,12),h=ri(2,12);return mk("num",`A triangle has area ${b*h} and base ${2*b}. What is its height?`,h,"From A = ½bh, h = 2A ÷ b.",`h = 2×${b*h} ÷ ${2*b} = ${h}`,{js:`2*${b*h}/${2*b}`})}]);
T("circle-basic","g7geo","7.G.4","Circumference & area of circles",["area-2d"],
 "A circle's circumference is the distance around it and its area is the space inside. Both use π ≈ 3.14. 'In terms of π' means leave π as a symbol.",
 ["Circumference: C = 2πr = πd.   Area: A = πr².","The diameter is twice the radius.","In terms of π: C = 14π. With 3.14: C = 14 × 3.14 = 43.96. Type pi for π."],
 [()=>{const r=ri(2,15);return mk("expr",`Find the circumference of a circle with radius ${r}. Leave your answer in terms of π.`,`${2*r}pi`,"C = 2πr.",`2 × π × ${r} = ${2*r}π`,{pe:`2*${r}*Math.PI`})},
  ()=>{const r=ri(2,12);return mk("expr",`Find the area of a circle with radius ${r}. Leave your answer in terms of π.`,`${r*r}pi`,"A = πr².",`π × ${r}² = ${r*r}π`,{pe:`Math.PI*${r}*${r}`})},
  ()=>{const r=ri(2,15);return mk("num",`Find the circumference of a circle with radius ${r} using π = 3.14.`,rdn(3.14*2*r,2),"C = 2πr.",`2 × 3.14 × ${r} = ${rdn(3.14*2*r,2)}`,{js:`3.14*2*${r}`})},
  ()=>{const r=ri(2,12);return mk("num",`Find the area of a circle with radius ${r} using π = 3.14.`,rdn(3.14*r*r,2),"A = πr².",`3.14 × ${r}² = ${rdn(3.14*r*r,2)}`,{js:`3.14*${r}*${r}`})},
  ()=>{const r=ri(3,15);return mk("num",`A circle has circumference ${2*r}π. What is its radius?`,r,"C = 2πr, so r = C ÷ (2π).",`${2*r}π ÷ 2π = ${r}`,{js:`${2*r}/2`})}]);
T("vol-prism","g7geo","7.G.6","Volume & surface area of prisms and pyramids",["area-2d"],
 "Volume is how much space a solid holds (cubic units); surface area is the total area of its faces (square units).",
 ["Prism: V = (area of base) × height. Rectangular prism: V = lwh.","Pyramid: V = ⅓ × (base area) × height.","Surface area of a rectangular prism: 2(lw + lh + wh)."],
 [()=>{const l=ri(2,12),w=ri(2,10),h=ri(2,10);return mk("num",`Find the volume of a rectangular prism ${l} by ${w} by ${h}.`,l*w*h,"V = l × w × h.",`${l}×${w}×${h} = ${l*w*h}`,{js:`${l}*${w}*${h}`})},
  ()=>{const l=ri(2,10),w=ri(2,9),h=ri(2,9);return mk("num",`Find the surface area of a rectangular prism ${l} by ${w} by ${h}.`,2*(l*w+l*h+w*h),"SA = 2(lw + lh + wh).",`2(${l*w} + ${l*h} + ${w*h}) = ${2*(l*w+l*h+w*h)}`,{js:`2*(${l}*${w}+${l}*${h}+${w}*${h})`})},
  ()=>{const b=ri(3,10),h=ri(2,9),L=ri(3,12);return mk("num",`A triangular prism has a triangular base with base ${2*b} and height ${h}, and the prism is ${L} long. Find its volume.`,b*h*L,"V = (area of base) × length; triangle area = ½bh.",`base area = ½×${2*b}×${h} = ${b*h}; V = ${b*h}×${L} = ${b*h*L}`,{js:`0.5*${2*b}*${h}*${L}`})},
  ()=>{const s=ri(2,9),h=ri(2,9);return mk("num",`A square pyramid has base edge ${s} and height ${h}. Find its volume.`,frs(s*s*h,3),"V = ⅓ × base area × height (give a fraction if needed).",`⅓ × ${s*s} × ${h} = ${s*s*h}/3 = ${frs(s*s*h,3)}`,{js:`${s}*${s}*${h}/3`})},
  ()=>{const l=ri(2,10),w=ri(2,9),h=ri(2,9);return mk("num",`A rectangular prism has volume ${l*w*h}, length ${l} and width ${w}. What is its height?`,h,"h = V ÷ (l × w).",`${l*w*h} ÷ ${l*w} = ${h}`,{js:`${l*w*h}/(${l}*${w})`})}]);
T("prob-simple","g7sp","7.SP.5","Probability of simple events",["frac-addsub"],
 "Probability measures how likely an event is, from 0 (impossible) to 1 (certain). For equally likely outcomes, P = favourable outcomes ÷ total outcomes.",
 ["P(event) = (number of favourable outcomes) / (total outcomes). Write it as a reduced fraction.","P(not A) = 1 − P(A).","The probabilities of all the outcomes add to 1."],
 [()=>{const r=ri(1,8),b=ri(1,8),g=ri(1,8);return mk("num",`A bag has ${r} red, ${b} blue and ${g} green marbles. What is the probability of drawing a red marble?`,frs(r,r+b+g),"P = favourable ÷ total.",`${r}/(${r}+${b}+${g}) = ${frs(r,r+b+g)}`,{js:`${r}/${r+b+g}`})},
  ()=>{const r=ri(1,8),b=ri(1,8),g=ri(1,8);return mk("num",`A bag has ${r} red, ${b} blue and ${g} green marbles. What is the probability of NOT drawing a red marble?`,frs(b+g,r+b+g),"P(not A) = 1 − P(A): count the non-red marbles.",`(${b}+${g})/${r+b+g} = ${frs(b+g,r+b+g)}`,{js:`1-${r}/${r+b+g}`})},
  ()=>{const c=pick([["an even number",[2,4,6]],["a prime number",[2,3,5]],["greater than 4",[5,6]],["a multiple of 3",[3,6]],["less than 3",[1,2]],["not a 1",[2,3,4,5,6]]]);return mk("num",`A fair six-sided die is rolled. What is the probability of rolling ${c[0]}?`,frs(c[1].length,6),"Count the favourable faces out of 6.",`${c[1].join(", ")} → ${c[1].length}/6 = ${frs(c[1].length,6)}`,{js:`[1,2,3,4,5,6].filter(v=>${JSON.stringify(c[1])}.includes(v)).length/6`})},
  ()=>{const c=pick([["a heart",13],["an ace",4],["a face card (J, Q, K)",12],["a red card",26],["the king of spades",1],["a black queen",2]]);return mk("num",`One card is drawn from a standard 52-card deck. What is the probability it is ${c[0]}?`,frs(c[1],52),"P = favourable ÷ 52.",`${c[1]}/52 = ${frs(c[1],52)}`,{js:`${c[1]}/52`})},
  ()=>{const n=ri(6,12);const odd=Math.ceil(n/2);return mk("num",`A spinner has ${n} equal sections numbered 1 to ${n}. What is the probability of landing on an odd number?`,frs(odd,n),"Count the odd numbers from 1 to n.",`odd numbers: ${odd}; P = ${odd}/${n} = ${frs(odd,n)}`,{js:`Array.from({length:${n}},(_,i)=>i+1).filter(v=>v%2===1).length/${n}`})}]);
T("prob-compound","g7sp","7.SP.8","Compound events & sample spaces",["prob-simple","frac-muldiv"],
 "A compound event combines two or more simple events. A sample space lists all possible outcomes; for independent events, multiply the probabilities.",
 ["Counting principle: m choices then n choices gives m × n outcomes.","Independent events: P(A and B) = P(A) × P(B).","Without replacement, the second probability changes: the totals each drop by 1."],
 [()=>{const n=ri(2,5);return mk("num",`A fair coin is flipped ${n} times. What is the probability that all ${n} flips are heads?`,frs(1,Math.pow(2,n)),"Multiply ½ for each independent flip.",`(1/2)^${n} = 1/${Math.pow(2,n)}`,{js:`0.5**${n}`})},
  ()=>{const a=ri(1,3),b=ri(a+1,5),c=ri(1,3),d=ri(c+1,6);return mk("num",`Spinner A lands on blue with probability ${a}/${b}; spinner B lands on blue with probability ${c}/${d}. What is the probability both land on blue?`,frs(a*c,b*d),"Independent events: multiply.",`${a}/${b} × ${c}/${d} = ${frs(a*c,b*d)}`,{js:`${a}/${b}*${c}/${d}`})},
  ()=>{const r=ri(2,6),b=ri(2,6);const t=r+b;return mk("num",`A bag has ${r} red and ${b} blue marbles. Two are drawn without replacement. What is the probability both are red?`,frs(r*(r-1),t*(t-1)),"Multiply P(first red) by P(second red), with one fewer marble in the bag.",`${r}/${t} × ${r-1}/${t-1} = ${frs(r*(r-1),t*(t-1))}`,{js:`${r}/${t}*${r-1}/${t-1}`})},
  ()=>{const s=ri(2,6),p=ri(2,5),h=ri(2,4);return mk("num",`You have ${s} shirts, ${p} pairs of pants and ${h} hats. How many different outfits (one of each) are possible?`,s*p*h,"Counting principle: multiply the number of choices.",`${s}×${p}×${h} = ${s*p*h}`,{js:`${s}*${p}*${h}`})},
  ()=>{const k=ri(2,12);const cnt=[1,2,3,4,5,6].reduce((a,x)=>a+[1,2,3,4,5,6].filter(y=>x+y===k).length,0);return mk("num",`Two fair dice are rolled. What is the probability that the sum is ${k}?`,frs(cnt,36),"List the pairs that give the sum; there are 36 equally likely outcomes.",`${cnt} favourable pairs out of 36 = ${frs(cnt,36)}`,{js:`[1,2,3,4,5,6].flatMap(a=>[1,2,3,4,5,6].map(b=>a+b)).filter(s=>s===${k}).length/36`})}]);
T("exp-prob","g7sp","7.SP.6","Experimental probability & predictions",["prob-simple","prop-solve"],
 "Experimental (relative-frequency) probability comes from what actually happened in trials. We use it to predict future results.",
 ["Experimental P = (times the event happened) ÷ (number of trials).","Expected count = probability × number of trials.","More trials usually bring the experimental probability closer to the theoretical one."],
 [()=>{const n=ri(10,40),r=ri(1,n-1);return mk("num",`A spinner landed on red ${r} times in ${n} spins. What is the experimental probability of red?`,frs(r,n),"Experimental P = successes ÷ trials.",`${r}/${n} = ${frs(r,n)}`,{js:`${r}/${n}`})},
  ()=>{const p=ri(1,9),q=ri(10,50),N=q*ri(2,20);return mk("num",`A factory finds ${p} of every ${q} items are defective. How many defective items are expected in ${N} items?`,p*N/q,"Expected = probability × number of items.",`${p}/${q} × ${N} = ${p*N/q}`,{js:`${p}/${q}*${N}`})},
  ()=>{const a=ri(5,20),b=ri(5,20),c=ri(5,20),n=a+b+c;return mk("num",`In ${n} trials the results were red ${a}, blue ${b}, green ${c}. What is the experimental probability of blue?`,frs(b,n),"Relative frequency = count ÷ total trials.",`${b}/${n} = ${frs(b,n)}`,{js:`${b}/${a+b+c}`})},
  ()=>{const n=pick([60,120,180,240,300]),a=Math.round(n/6)+ri(-8,8);return mk("num",`A fair die is rolled ${n} times and a six appears ${a} times. How far is this from the number of sixes you would expect (absolute difference)?`,Math.abs(a-n/6),"Expected sixes = n ÷ 6; then take |actual − expected|.",`expected = ${n/6}; |${a} - ${n/6}| = ${Math.abs(a-n/6)}`,{js:`Math.abs(${a}-${n}/6)`})}]);
T("stat-center","g7sp","6.SP.5","Mean, median, mode & range",["dec-ops"],
 "Measures of center summarise a data set with one number: the mean (balance point), median (middle) and mode (most common). The range measures spread.",
 ["Mean = sum ÷ count.   Median = middle value of the sorted list (average the two middles if the count is even).","Mode = most frequent value.   Range = maximum − minimum.","Always sort the data before finding the median."],
 [()=>{const n=ri(5,7);let a;do{a=Array.from({length:n},()=>ri(2,30))}while(a.reduce((x,y)=>x+y)%n!==0);const s=a.reduce((x,y)=>x+y);return mk("num",`Find the mean: ${a.join(", ")}`,s/n,"Mean = sum ÷ number of values.",`sum = ${s}; ${s} ÷ ${n} = ${s/n}`,{js:`[${a}].reduce((x,y)=>x+y)/${n}`})},
  ()=>{const n=pick([5,7,9]);const a=Array.from({length:n},()=>ri(1,40));const s=a.slice().sort((x,y)=>x-y);return mk("num",`Find the median: ${a.join(", ")}`,s[(n-1)/2],"Sort the list; the median is the middle value.",`sorted: ${s.join(", ")}; middle = ${s[(n-1)/2]}`,{js:`[${a}].sort((x,y)=>x-y)[${(n-1)/2}]`})},
  ()=>{const n=pick([6,8]);const a=Array.from({length:n},()=>ri(1,40));const s=a.slice().sort((x,y)=>x-y);const m=(s[n/2-1]+s[n/2])/2;return mk("num",`Find the median: ${a.join(", ")}`,m,"Sort the list; with an even count, average the two middle values.",`sorted: ${s.join(", ")}; (${s[n/2-1]} + ${s[n/2]})/2 = ${m}`,{js:`([${a}].sort((x,y)=>x-y)[${n/2-1}]+[${a}].sort((x,y)=>x-y)[${n/2}])/2`})},
  ()=>{const m=ri(2,20),a=[m,m,m];for(let i=0;i<4;i++){let v;do{v=ri(1,25)}while(v===m);a.push(v)}const sh=shuffle(a);return mk("num",`Find the mode: ${sh.join(", ")}`,m,"The mode is the value that appears most often.",`${m} appears 3 times; every other value appears once or twice`,{js:`${m}`})},
  ()=>{const a=Array.from({length:ri(5,8)},()=>ri(1,60));return mk("num",`Find the range: ${a.join(", ")}`,Math.max(...a)-Math.min(...a),"Range = max − min.",`${Math.max(...a)} - ${Math.min(...a)} = ${Math.max(...a)-Math.min(...a)}`,{js:`Math.max(${a})-Math.min(${a})`})},
  ()=>{const k=ri(4,6),m=ri(60,90);const sc=Array.from({length:k-1},()=>ri(55,100));const need=m*k-sc.reduce((x,y)=>x+y);if(need<0||need>130)return TOPIC_BY_ID["stat-center"].gens[5]();return mk("num",`Your first ${k-1} test scores are ${sc.join(", ")}. What score do you need on test ${k} to have a mean of ${m}?`,need,"Needed total = mean × count; subtract what you have.",`${m}×${k} = ${m*k}; ${m*k} - ${sc.reduce((x,y)=>x+y)} = ${need}`,{js:`${m}*${k}-[${sc}].reduce((x,y)=>x+y)`})}]);
T("stat-spread","g7sp","7.SP.4","Quartiles, IQR & mean absolute deviation",["stat-center"],
 "Quartiles split sorted data into four parts. The interquartile range (IQR = Q3 − Q1) measures the spread of the middle half. MAD is the average distance from the mean.",
 ["Q1 is the median of the lower half; Q3 is the median of the upper half (exclude the median when the count is odd).","IQR = Q3 − Q1.  Outlier fences: Q1 − 1.5·IQR and Q3 + 1.5·IQR.","MAD = average of |value − mean|."],
 [()=>{const n=pick([8,9]);const a=Array.from({length:n},()=>ri(1,50));const s=a.slice().sort((x,y)=>x-y);const q1=(s[1]+s[2])/2,q3=n===8?(s[5]+s[6])/2:(s[6]+s[7])/2;
   return mk("num",`Find the IQR of: ${a.join(", ")}`,q3-q1,"Sort; Q1 = median of the lower half, Q3 = median of the upper half; IQR = Q3 − Q1.",`sorted: ${s.join(", ")}; Q1 = ${q1}, Q3 = ${q3}; IQR = ${q3-q1}`,{js:`(${q3})-(${q1})`})},
  ()=>{const n=8;const a=Array.from({length:n},()=>ri(1,60));const s=a.slice().sort((x,y)=>x-y);return mk("num",`Find the first quartile Q1 of: ${a.join(", ")}`,(s[1]+s[2])/2,"Q1 is the median of the lower half of the sorted data.",`sorted: ${s.join(", ")}; lower half ${s.slice(0,4).join(", ")}; Q1 = ${(s[1]+s[2])/2}`,{js:`([${a}].sort((x,y)=>x-y)[1]+[${a}].sort((x,y)=>x-y)[2])/2`})},
  ()=>{let a;do{a=Array.from({length:5},()=>ri(2,30))}while(a.reduce((x,y)=>x+y)%5!==0);const m=a.reduce((x,y)=>x+y)/5;const d=a.reduce((x,y)=>x+Math.abs(y-m),0);return mk("num",`Find the mean absolute deviation (MAD) of: ${a.join(", ")}`,rdn(d/5,2),"Find the mean, then average the distances |x − mean|.",`mean = ${m}; distances: ${a.map(v=>Math.abs(v-m)).join(", ")}; sum ${d}; ${d}/5 = ${rdn(d/5,2)}`,{js:`[${a}].reduce((s,v)=>s+Math.abs(v-${m}),0)/5`})},
  ()=>{const q1=ri(10,30),i=ri(4,20),q3=q1+i;return mk("num",`A data set has Q1 = ${q1} and Q3 = ${q3}. What is the upper outlier fence, Q3 + 1.5 × IQR?`,rdn(q3+1.5*i,2),"IQR = Q3 − Q1; fence = Q3 + 1.5·IQR.",`IQR = ${i}; ${q3} + 1.5×${i} = ${rdn(q3+1.5*i,2)}`,{js:`${q3}+1.5*(${q3}-${q1})`})}]);
T("sampling","g7sp","7.SP.2","Random sampling & population inference",["prop-solve","prob-simple"],
 "A random sample that represents the population lets you predict the whole population from a small part.",
 ["A representative sample is chosen at random from the whole population; convenient or self-selected samples are biased.","Sample proportion = (count in sample) ÷ (sample size).","Predicted population count = sample proportion × population size."],
 [()=>{const n=ri(20,50),k=ri(3,n-3),N=n*ri(10,40);return mk("num",`In a random sample of ${n} students, ${k} prefer pizza. About how many of the ${N} students at the school prefer pizza?`,k*N/n,"Scale the sample proportion up to the population.",`${k}/${n} × ${N} = ${k*N/n}`,{js:`${k}/${n}*${N}`})},
  ()=>{const n=ri(2,10)*10,N=ri(5,40)*100,pct=ri(10,90);return mk("num",`A random survey of ${n} voters found ${pct}% support a proposal. About how many of ${N} voters support it?`,rdn(pct/100*N,2),"Population estimate = percent × population size.",`${pct}% of ${N} = ${rdn(pct/100*N,2)}`,{js:`${pct}/100*${N}`})},
  ()=>{const N=ri(5,30)*100;const good="randomly choosing students from the school's full roster",wrong=["surveying only the school basketball team","asking the first 15 students who arrive at school","surveying students who volunteer in a sign-up poll"];return mcq(`To learn which lunch the ${N} students of a school like best, which sample is most likely to be representative?`,good.charAt(0).toUpperCase()+good.slice(1),wrong.map(w=>w.charAt(0).toUpperCase()+w.slice(1)),"A random sample from the whole population avoids bias.","Only the roster-based random sample gives every student an equal chance.")}]);

T("sci-not","g8ee","8.EE.3","Scientific notation",["exp-neg-zero","dec-ops"],
 "Scientific notation writes very large or very small numbers as a number from 1 up to 10 times a power of ten, so m × 10ⁿ with 1 ≤ m < 10.",
 ["Move the decimal point until one non-zero digit is in front: 45,000,000 = 4.5 × 10⁷ (moved 7 places left, exponent +7).","Numbers smaller than 1 get negative exponents: 0.00032 = 3.2 × 10⁻⁴.","Multiply: multiply the front numbers, add exponents; then fix the front number if it is 10 or more. Type as 4.5 x 10^7."],
 [()=>{const m=ri(11,99)/10,e=pick([ri(3,9),-ri(3,8)]);return mk("expr",`Write ${digits(m,e)} in scientific notation.`,`${m} * 10^${e}`,"Place the decimal after the first non-zero digit and count the places moved.",`${digits(m,e)} = ${m} × 10^${e}`,{form:"sci",pe:`${m}*10**(${e})`})},
  ()=>{const m=ri(11,99)/10,e=pick([ri(2,7),-ri(2,6)]);return mk("num",`Write ${m} × 10^${e} in standard (decimal) form.`,digits(m,e),"A positive exponent moves the decimal right; a negative exponent moves it left.",`${m} × 10^${e} = ${digits(m,e)}`,{js:`${m}*10**(${e})`})},
  ()=>{const a=ri(2,9),b=ri(2,6),p=ri(2,8),q=ri(2,8);const prod=a*b;const m=prod>=10?prod/10:prod,e=p+q+(prod>=10?1:0);return mk("expr",`Compute and write in scientific notation: (${a} × 10^${p})(${b} × 10^${q})`,`${m} * 10^${e}`,"Multiply the front numbers, add the exponents, then renormalise so the front number is between 1 and 10.",`${a}×${b} = ${prod}; 10^${p}×10^${q} = 10^${p+q}; result ${m} × 10^${e}`,{form:"sci",pe:`(${a}*10**${p})*(${b}*10**${q})`})},
  ()=>{const b=ri(1,4),k=ri(2,Math.floor(9/b)),p=ri(6,12),q=ri(1,5);const a=b*k;return mk("expr",`Compute and write in scientific notation: (${a} × 10^${p}) ÷ (${b} × 10^${q})`,`${k} * 10^${p-q}`,"Divide the front numbers and subtract the exponents.",`${a}÷${b} = ${k}; 10^${p}÷10^${q} = 10^${p-q}`,{form:"sci",pe:`(${a}*10**${p})/(${b}*10**${q})`})},
  ()=>{const b=ri(1,4),k=ri(2,Math.floor(9/b)),p=ri(5,9),q=ri(1,4);return mk("num",`How many times as large is ${b*k} × 10^${p} as ${b} × 10^${q}?`,k*Math.pow(10,p-q),"Divide: (front ÷ front) × 10^(difference of exponents).",`${k} × 10^${p-q} = ${k*Math.pow(10,p-q)}`,{js:`(${b*k}*10**${p})/(${b}*10**${q})`})}]);
T("exp-num","g8ee","8.EE.1","Exponent rules with numbers",["exp-neg-zero"],
 "The exponent rules work with numeric bases too, and let you evaluate hard-looking expressions without a calculator.",
 ["aᵐ · aⁿ = aᵐ⁺ⁿ;  aᵐ ÷ aⁿ = aᵐ⁻ⁿ;  (aᵐ)ⁿ = aᵐⁿ.","(a/b)ⁿ = aⁿ/bⁿ and (a/b)⁻ⁿ = (b/a)ⁿ.","Reduce exponents first, then evaluate: 2⁵·2² ÷ 2⁴ = 2³ = 8."],
 [()=>{const b=pick([2,3,5]),x=ri(2,6),y=ri(2,6),z=ri(2,8);const e=x+y-z;const ans=e>=0?String(Math.pow(b,e)):`1/${Math.pow(b,-e)}`;return mk("num",`Evaluate: (${b}^${x} · ${b}^${y}) ÷ ${b}^${z}`,ans,"Add exponents for the product, subtract for the quotient.",`${b}^(${x}+${y}-${z}) = ${b}^${e} = ${ans}`,{js:`${b}**${x}*${b}**${y}/${b}**${z}`})},
  ()=>{const b=pick([2,3,4,5]),x=ri(2,4),y=ri(2,3);return mk("num",`Evaluate: (${b}^${x})^${y}`,Math.pow(b,x*y),"Power of a power: multiply the exponents.",`${b}^(${x}×${y}) = ${b}^${x*y} = ${Math.pow(b,x*y)}`,{js:`(${b}**${x})**${y}`})},
  ()=>{const a=ri(1,5),b=ri(a+1,7);if(gcd(a,b)!==1)return TOPIC_BY_ID["exp-num"].gens[2]();const n=pick([-3,-2,2,3]);const num=n>0?Math.pow(a,n):Math.pow(b,-n),den=n>0?Math.pow(b,n):Math.pow(a,-n);return mk("num",`Evaluate: (${a}/${b})^${n}`,frs(num,den),"Raise numerator and denominator to the power; a negative exponent flips the fraction.",`${n>0?"":"flip: ("+b+"/"+a+")^"+(-n)+" ; "}${num}/${den}`,{js:`(${a}/${b})**${n}`})},
  ()=>{const b=pick([2,3,5]),p=ri(2,5),q=ri(2,5),k=p+q;const t=pick(["prod","quot","pow"]);
     if(t==="prod")return mk("num",`Solve for n: ${b}^${p} · ${b}^${q} = ${b}^n`,k,"Add the exponents on the left.",`${p} + ${q} = ${k}`,{js:`${p}+${q}`});
     if(t==="quot")return mk("num",`Solve for n: ${b}^${k} ÷ ${b}^${p} = ${b}^n`,q,"Subtract the exponents on the left.",`${k} - ${p} = ${q}`,{js:`${k}-${p}`});
     return mk("num",`Solve for n: (${b}^${p})^${q} = ${b}^n`,p*q,"Multiply the exponents on the left.",`${p} × ${q} = ${p*q}`,{js:`${p}*${q}`})}]);
T("sqrt-basic","g8ee","8.EE.2","Square roots & cube roots",["exp-prod"],
 "A square root undoes squaring and a cube root undoes cubing. Equations x² = p have two solutions (±√p); x³ = p has exactly one.",
 ["√(k²) = k for k ≥ 0 (the principal root); a positive number has two square roots, ±.","∛(k³) = k, and a negative number has a real cube root: ∛(−8) = −2.","x² = 49 → x = ±7.  x³ = 64 → x = 4."],
 [()=>{const k=ri(2,20);return mk("num",`Evaluate: sqrt(${k*k})`,k,"Find the number whose square is under the root.",`${k}² = ${k*k}, so √${k*k} = ${k}`,{js:`Math.sqrt(${k*k})`})},
  ()=>{const k=ri(1,10)*pick([1,-1]);return mk("num",`Evaluate: cbrt(${k*k*k})`,k,"Find the number whose cube is under the root.",`(${k})³ = ${k*k*k}`,{js:`Math.cbrt(${k*k*k})`})},
  ()=>{const k=ri(2,15);return mk("set",`Solve for x: x^2 = ${k*k}`,`${-k}, ${k}`,"Take both the positive and negative square root.",`x = ±√${k*k} = ±${k}`,{fx:`x*x-${k*k}`,nroots:2})},
  ()=>{const k=ri(2,9)*pick([1,-1]);return mk("num",`Solve for x: x^3 = ${k*k*k}`,k,"Take the cube root (only one real solution).",`x = ∛${k*k*k} = ${k}`,{eqs:[`x*x*x=${k*k*k}`]})},
  ()=>{const a=ri(1,9),b=ri(a+1,10);if(gcd(a,b)!==1)return TOPIC_BY_ID["sqrt-basic"].gens[4]();return mk("num",`Evaluate: sqrt(${a*a}/${b*b})`,frs(a,b),"Take the square root of the numerator and denominator separately.",`√${a*a} = ${a}; √${b*b} = ${b}; ${a}/${b}`,{js:`Math.sqrt(${a*a}/${b*b})`})}]);
T("irrational","g8ee","8.NS.2","Irrational numbers & estimating roots",["sqrt-basic","frac-dec"],
 "A rational number can be written as a fraction of integers (terminating or repeating decimals). Irrational numbers like √2 and π have decimals that never end or repeat.",
 ["√n is rational only when n is a perfect square (√49 = 7); otherwise it is irrational.","Estimate √n by finding the perfect squares on each side: 36 < 40 < 49, so √40 is between 6 and 7.","Square-root estimates: test tenths, e.g. 6.3² = 39.69, so √40 ≈ 6.3."],
 [()=>{let n;do{n=ri(2,99)}while(SQ(n)||Math.abs((Math.sqrt(n)*10)%1-0.5)<0.07);return mk("num",`Estimate sqrt(${n}) to the nearest tenth.`,rdn(Math.sqrt(n),1),"Bracket between perfect squares, then refine by testing tenths.",`${Math.floor(Math.sqrt(n))}² = ${Math.floor(Math.sqrt(n))**2} < ${n} < ${(Math.floor(Math.sqrt(n))+1)**2}; √${n} ≈ ${rdn(Math.sqrt(n),1)}`,{js:`Math.sqrt(${n})`,jtol:0.0500001})},
  ()=>{let n;do{n=ri(5,150)}while(SQ(n));const f=Math.floor(Math.sqrt(n));return mk("num",`sqrt(${n}) lies between two consecutive integers. What is the smaller one?`,f,"Find the largest perfect square not exceeding the number.",`${f}² = ${f*f} ≤ ${n} < ${(f+1)**2}`,{js:`Math.floor(Math.sqrt(${n}))`})},
  ()=>{let n;do{n=ri(2,60)}while(SQ(n));const irr=pick([`√${n}`,"π",`√${n+1>1&&!SQ(n+1)?n+1:n}`]);const rat=shuffle([`√${pick([4,9,16,25,36,49,64,81])}`,`${ri(1,9)}/${ri(2,9)}`,`0.${ri(1,9)}${ri(1,9)}`,`−${ri(1,9)}.${ri(1,9)}`,`${pick(["0.333…","0.121212…","0.25"])}`]);const wr=[];for(const r of rat){if(!wr.includes(r)&&r!==irr)wr.push(r);if(wr.length===3)break}
     return mcq("Which of these numbers is irrational?",irr,wr,"Irrational numbers have non-terminating, non-repeating decimals (non-perfect-square roots and π).","The others are perfect-square roots, fractions, or terminating/repeating decimals.")},
  ()=>{const m=ri(3,12);let n;do{n=ri(m*m-m,m*m+m)}while(n===m*m);return mcq(`Which is greater: √${n} or ${m}?`,n>m*m?`√${n}`:`${m}`,[n>m*m?`${m}`:`√${n}`],"Compare the squares: √n > m exactly when n > m².",`${m}² = ${m*m}; compare with ${n}`)}]);
T("pyth","g8pyth","8.G.7","Pythagorean theorem",["sqrt-basic","twostep-eq"],
 "In a right triangle with legs a and b and hypotenuse c (the side opposite the right angle), a² + b² = c².",
 ["Hypotenuse: c = √(a² + b²).  Missing leg: a = √(c² − b²).","Pythagorean triples to recognise: 3-4-5, 5-12-13, 8-15-17, 7-24-25 and their multiples.","Not a perfect square? Simplify the radical, e.g. √50 = 5√2. Type sqrt(50) as 5sqrt(2)."],
 [()=>{const [a,b,c]=pick(TRI),k=ri(1,3);return mk("num",`A right triangle has legs ${a*k} and ${b*k}. Find the hypotenuse.`,c*k,"c² = a² + b².",`${a*k}² + ${b*k}² = ${(a*k)**2+(b*k)**2}; c = ${c*k}`,{js:`Math.sqrt(${a*k}**2+${b*k}**2)`})},
  ()=>{const [a,b,c]=pick(TRI),k=ri(1,3);return mk("num",`A right triangle has hypotenuse ${c*k} and one leg ${a*k}. Find the other leg.`,b*k,"a² = c² − b².",`${c*k}² - ${a*k}² = ${(c*k)**2-(a*k)**2}; leg = ${b*k}`,{js:`Math.sqrt(${c*k}**2-${a*k}**2)`})},
  ()=>{let a,b;do{a=ri(1,12);b=ri(1,12)}while(a===b);return mk("expr",`Find the hypotenuse of a right triangle with legs ${a} and ${b}. Give the answer as a simplified radical (or integer).`,radStr(a*a+b*b),"c = √(a² + b²), then simplify the radical.",`${a}² + ${b}² = ${a*a+b*b}; c = ${radStr(a*a+b*b).replace(/sqrt\((\d+)\)/,"√$1")}`,{form:"rad",pe:`Math.sqrt(${a*a+b*b})`})},
  ()=>{const [a,b,c]=pick(TRI.slice(0,4)),k=ri(1,3);return mk("num",`A ${c*k}-foot ladder leans against a wall with its base ${a*k} feet from the wall. How high up the wall does it reach (feet)?`,b*k,"The ladder is the hypotenuse; solve for the leg.",`${c*k}² - ${a*k}² = ${(c*k)**2-(a*k)**2}; height = ${b*k}`,{js:`Math.sqrt(${c*k}**2-${a*k}**2)`})},
  ()=>{const [a,b,c]=pick(TRI),k=ri(1,3);return mk("num",`A rectangle is ${a*k} cm by ${b*k} cm. How long is its diagonal (cm)?`,c*k,"The diagonal is the hypotenuse of a right triangle with the sides as legs.",`√(${a*k}² + ${b*k}²) = ${c*k}`,{js:`Math.hypot(${a*k},${b*k})`})}]);
T("pyth-apps","g8pyth","8.G.8","Distance & the converse of the Pythagorean theorem",["pyth","irrational"],
 "The Pythagorean theorem gives the distance between two points: make a right triangle whose legs are the horizontal and vertical changes.",
 ["Distance = √((x₂ − x₁)² + (y₂ − y₁)²).","Converse: if a² + b² = c² for the sides of a triangle, it is a right triangle (c longest).","Simplify radical answers: √72 = 6√2."],
 [()=>{const [a,b,c]=pick(TRI.slice(0,4)),k=ri(1,2);const x1=ri(-6,6),y1=ri(-6,6),sx=pick([-1,1]),sy=pick([-1,1]);const x2=x1+sx*a*k,y2=y1+sy*b*k;return mk("num",`Find the distance between (${x1}, ${y1}) and (${x2}, ${y2}).`,c*k,"Distance = √(Δx² + Δy²).",`Δx = ${x2-x1}, Δy = ${y2-y1}; √(${(a*k)**2} + ${(b*k)**2}) = ${c*k}`,{js:`Math.hypot(${x2}-(${x1}),${y2}-(${y1}))`})},
  ()=>{let dx,dy;do{dx=ri(1,9);dy=ri(1,9)}while(dx===dy);const x1=ri(-5,5),y1=ri(-5,5);return mk("expr",`Find the distance between (${x1}, ${y1}) and (${x1+dx}, ${y1-dy}) as a simplified radical (or integer).`,radStr(dx*dx+dy*dy),"Use the distance formula and simplify the radical.",`Δx = ${dx}, Δy = ${-dy}; √(${dx*dx} + ${dy*dy}) = √${dx*dx+dy*dy}`,{form:"rad",pe:`Math.hypot(${dx},${dy})`})},
  ()=>{const [a,b,c]=pick(TRI),k=ri(1,3);const right=Math.random()<0.5;const cc=right?c*k:c*k+pick([-1,1]);const sides=shuffle([a*k,b*k,cc]);return mcq(`A triangle has sides ${sides.join(", ")}. Is it a right triangle?`,right?"Yes":"No",[right?"No":"Yes"],"Check whether a² + b² = c² with c the longest side.",`${a*k}² + ${b*k}² = ${(a*k)**2+(b*k)**2}; ${cc}² = ${cc*cc}; ${right?"equal":"not equal"}`,{js:`(${(a*k)**2+(b*k)**2}===${cc*cc})===${right}`})},
  ()=>{const [a,b,c]=pick(TRI.slice(0,4)),k=ri(1,3);return mk("num",`An isosceles triangle has two equal sides of length ${c*k} and base ${2*a*k}. Find its height to the base.`,b*k,"The height splits the base in half, forming a right triangle with the equal side as hypotenuse.",`half base = ${a*k}; h = √(${c*k}² − ${a*k}²) = ${b*k}`,{js:`Math.sqrt(${c*k}**2-${a*k}**2)`})}]);
T("eq-both","g8eq","8.EE.7","Equations with variables on both sides",["eq-paren","multistep-eq"],
 "When the variable appears on both sides, collect the variable terms on one side and the constants on the other, then solve. Some equations have no solution or infinitely many.",
 ["Subtract the smaller variable term from both sides to get one x-term.","If the variables cancel and the statement is false (3 = 5) there is no solution; if true (4 = 4) there are infinitely many.","Always check by substituting back."],
 [()=>{let a,c;do{a=ri(1,8);c=ri(-5,8)}while(a===c);const x0=rnz(-9,9),b=ri(-12,12),d=(a-c)*x0+b;return mk("num",`Solve for x: ${lin(a,b)} = ${lin(c,d)}`,x0,"Collect x terms on one side and constants on the other.",`${a-c}x = ${d-b} ⇒ x = ${x0}`,{eqs:[`${a}*x+(${b})=${c}*x+(${d})`]})},
  ()=>{let p,a;do{p=ri(2,6);a=ri(-3,7)}while(p===a);const x0=rnz(-8,8),q=rnz(-6,6),d=(p-a)*x0+p*q;return mk("num",`Solve for x: ${p}(x + ${q}) = ${lin(a,d)}`.replace("+ -","- "),x0,"Distribute first, then collect like terms.",`${p}x + ${p*q} = ${lin(a,d)} ⇒ ${p-a}x = ${d-p*q} ⇒ x = ${x0}`,{eqs:[`${p}*(x+(${q}))=${a}*x+(${d})`]})},
  ()=>{const t=pick(["one","none","inf"]);const a=ri(2,7),b=ri(-8,8);let q;
     if(t==="one"){const c=a+pick([-1,1])*ri(1,3);const d=ri(-8,8);q=`${lin(a,b)} = ${lin(c,d)}`}else if(t==="none"){q=`${lin(a,b)} = ${lin(a,b+pick([-1,1])*ri(1,5))}`}else{q=`${lin(a,b)} = ${lin(a,b)}`}
     const ans=t==="one"?"One solution":t==="none"?"No solution":"Infinitely many solutions";return mcq(`How many solutions does ${q} have?`,ans,["One solution","No solution","Infinitely many solutions"].filter(x=>x!==ans),"Simplify: if the x-terms cancel, a false statement means no solution and a true one means infinitely many.",t==="one"?"The x-coefficients differ, so exactly one x works.":t==="none"?"The x terms cancel, leaving false constants.":"Both sides are identical.")},
  ()=>{let a,c;do{a=ri(2,6);c=ri(2,6)}while(a===c);const L=lcm(a,c),x0=L*rnz(-3,3),b=ri(-6,6),d=x0/a-x0/c+b;return mk("num",`Solve for x: x/${a} + ${b} = x/${c} + ${d}`.replace("+ -","- "),x0,"Collect the x terms, then clear the fractions with the LCD.",`x(1/${a} − 1/${c}) = ${d-b} ⇒ x = ${x0}`,{eqs:[`x/${a}+(${b})=x/${c}+(${d})`]})},
  ()=>{const F1=ri(10,40),F2=ri(0,9),r1=ri(2,6);let r2;do{r2=ri(7,15)}while(r2<=r1);const n=ri(2,10);const F2b=F1+(r1-r2)*n;if(F2b<0||F2b>60)return TOPIC_BY_ID["eq-both"].gens[4]();return mk("num",`Plan A costs $${F1} plus $${r1} per visit. Plan B costs $${F2b} plus $${r2} per visit. After how many visits do the plans cost the same?`,n,"Set the costs equal and solve.",`${F1} + ${r1}n = ${F2b} + ${r2}n ⇒ ${F1-F2b} = ${r2-r1}n ⇒ n = ${n}`,{eqs:[`${F1}+${r1}*x=${F2b}+${r2}*x`]})}]);
T("sys-intro","g8eq","8.EE.8","Systems of equations: solutions & number of solutions",["slope-int"],
 "A solution of a system satisfies every equation. Graphically it is where the lines cross; parallel lines never meet and identical lines overlap everywhere.",
 ["Check a point by substituting into both equations.","Different slopes → exactly one solution. Same slope, different intercept → none. Same slope and intercept → infinitely many.","Two equations y = … can be solved by setting the right sides equal."],
 [()=>{const x=ri(-5,5),y=ri(-5,5);const a1=ri(1,4),b1=ri(1,4),a2=ri(1,4),b2=-ri(1,4);const c1=a1*x+b1*y,c2=a2*x+b2*y;const yes=Math.random()<0.5;const px=yes?x:x+pick([-1,1]);return mcq(`Is (${px}, ${y}) a solution of the system ${a1}x + ${b1}y = ${c1} and ${lin(a2,0)} ${b2<0?"-":"+"} ${Math.abs(b2)}y = ${c2}?`.replace("x + 0","x"),yes?"Yes":"No",[yes?"No":"Yes"],"Substitute the point into BOTH equations; it must satisfy both.",`${a1}(${px}) + ${b1}(${y}) = ${a1*px+b1*y}; ${a2}(${px}) ${b2<0?"−":"+"} ${Math.abs(b2)}(${y}) = ${a2*px+b2*y}; ${yes?"both match":"at least one fails"}`,{js:`((${a1*px+b1*y}===${c1})&&(${a2*px+b2*y}===${c2}))===${yes}`})},
  ()=>{const t=pick(["one","none","inf"]);const m=rnz(-5,5),b=ri(-6,6);let m2,b2;if(t==="one"){do{m2=rnz(-5,5)}while(m2===m);b2=ri(-6,6)}else if(t==="none"){m2=m;do{b2=ri(-6,6)}while(b2===b)}else{m2=m;b2=b}
     const ans=t==="one"?"One solution":t==="none"?"No solution":"Infinitely many solutions";return mcq(`How many solutions does the system y = ${lin(m,b,"x")} and y = ${lin(m2,b2,"x")} have?`,ans,["One solution","No solution","Infinitely many solutions"].filter(x=>x!==ans),"Compare slopes and y-intercepts.",t==="one"?"The slopes differ.":t==="none"?"Same slope, different intercepts: parallel lines.":"Same slope and same intercept: the same line.")},
  ()=>{const x=ri(-5,6),y=ri(-6,8);let m1,m2;do{m1=rnz(-3,3);m2=rnz(-3,3)}while(m1===m2);const b1=y-m1*x,b2=y-m2*x;return mk("pair",`Solve the system by setting the right sides equal: y = ${lin(m1,b1)} and y = ${lin(m2,b2)}`,`(${x}, ${y})`,"Set the two expressions for y equal, solve for x, then find y.",`${lin(m1,b1)} = ${lin(m2,b2)} ⇒ ${m1-m2}x = ${b2-b1} ⇒ x = ${x}; y = ${y}`,{eqs:[`y=${m1}*x+(${b1})`,`y=${m2}*x+(${b2})`]})}]);
T("lin-graph","g8eq","8.EE.6","Slope & intercepts of a line",["slope","multistep-eq"],
 "A line Ax + By = C can be read through its slope and intercepts. Setting x = 0 gives the y-intercept; setting y = 0 gives the x-intercept.",
 ["Solve for y to get slope-intercept form y = mx + b: slope m, y-intercept b.","y-intercept: let x = 0 (so y = C/B).  x-intercept: let y = 0 (so x = C/A).","From Ax + By = C: slope = −A/B."],
 [()=>{const A=rnz(-6,6),B=rnz(-6,6),C=ri(-12,12);return mk("num",`Find the slope of the line ${polyStr([[A,"x"],[B,"y"]])} = ${C}.`,frs(-A,B),"Solve for y: slope = −A/B.",`${B}y = ${-A}x + ${C} ⇒ slope = ${frs(-A,B)}`,{js:`-(${A})/(${B})`})},
  ()=>{const A=rnz(-6,6),B=rnz(-6,6),C=rnz(-12,12);return mk("num",`Find the y-intercept of ${polyStr([[A,"x"],[B,"y"]])} = ${C}.`,frs(C,B),"Set x = 0 and solve for y.",`${B}y = ${C} ⇒ y = ${frs(C,B)}`,{js:`${C}/(${B})`})},
  ()=>{const A=rnz(-6,6),B=rnz(-6,6),C=rnz(-12,12);return mk("num",`Find the x-intercept of ${polyStr([[A,"x"],[B,"y"]])} = ${C}.`,frs(C,A),"Set y = 0 and solve for x.",`${A}x = ${C} ⇒ x = ${frs(C,A)}`,{js:`${C}/(${A})`})},
  ()=>{const A=rnz(-6,6),B=rnz(-6,6),C=ri(-12,12);return mk("eq",`Write ${polyStr([[A,"x"],[B,"y"]])} = ${C} in slope-intercept form (y = mx + b).`,siStr(-A,B,C,B),"Isolate y and divide every term by its coefficient.",`${B}y = ${-A}x + ${C} ⇒ ${siStr(-A,B,C,B)}`,{pe:`y-(${-A}/${B}*x+${C}/${B})`})}]);
T("func-concept","g8fn","8.F.1","What is a function?",["func-eval"],
 "A function assigns to each input exactly one output. A relation fails to be a function if one input is paired with two different outputs.",
 ["Check a set of ordered pairs: no x-value may repeat with a different y-value.","On a graph, use the vertical-line test: a vertical line must never cross the graph twice.","Evaluate from a table by reading the output next to the input."],
 [()=>{const isF=Math.random()<0.5;const xs=distinct(4,-5,6);const pairs=xs.map(x=>[x,ri(-5,8)]);if(!isF)pairs[3]=[xs[0],pairs[0][1]+pick([-2,-1,1,2,3])];const s=shuffle(pairs).map(p=>`(${p[0]}, ${p[1]})`).join(", ");return mcq(`Is the relation {${s}} a function?`,isF?"Yes":"No",[isF?"No":"Yes"],"A function never assigns two different outputs to the same input.",isF?"Every x-value appears once.":`The input ${xs[0]} appears with two different outputs.`,{js:`new Set([${pairs.map(p=>p[0])}]).size===${pairs.length}===${isF}`})},
  ()=>{const xs=[1,2,3,4,5].slice(0,4).map(x=>x+ri(0,2)*0);const ys=xs.map(()=>ri(-9,20));const k=ri(0,3);return mk("num",`A function f is given by the table: f(${xs[0]}) = ${ys[0]}, f(${xs[1]}) = ${ys[1]}, f(${xs[2]}) = ${ys[2]}, f(${xs[3]}) = ${ys[3]}. What is f(${xs[k]})... `.replace("... ","")+`Give the output when the input is ${xs[k]}.`,ys[k],"Read the output paired with the input.",`f(${xs[k]}) = ${ys[k]}`,{js:`[${ys}][${k}]`})},
  ()=>{const a=rnz(-5,6),b=ri(-9,9),x0=rnz(-6,8),out=a*x0+b;return mk("num",`The function is f(x) = ${lin(a,b)}. For what input x is f(x) = ${out}?`,x0,"Set the rule equal to the output and solve for x.",`${lin(a,b)} = ${out} ⇒ ${a}x = ${out-b} ⇒ x = ${x0}`,{eqs:[`${a}*x+(${b})=${out}`]})},
  ()=>{const c=pick([["y = 2x + 3","Yes"],["y = x^2","Yes"],["y = |x|","Yes"],["x = 5","No"],["x^2 + y^2 = 25","No"],["x = y^2","No"],["y = 7","Yes"],["y = 1/x","Yes"]]);return mcq(`Does ${c[0]} define y as a function of x?`,c[1],[c[1]==="Yes"?"No":"Yes"],"For each x there must be exactly one y (vertical-line test).",c[1]==="Yes"?"Each x gives only one y.":"Some x-values give two y-values (or a whole line of them).")}]);
T("func-compare","g8fn","8.F.2","Comparing functions",["func-concept","slope-int"],
 "Functions can be given in different forms — equations, tables, graphs, words. To compare them, find the same features (rate of change, initial value) for each.",
 ["Rate of change = slope = Δy ÷ Δx; initial value = output when input is 0.","From two table points: m = (y₂ − y₁)/(x₂ − x₁); then b = y₁ − m·x₁.","Compare rates by comparing slopes; compare values by evaluating both functions at the same input."],
 [()=>{const m1=ri(1,9),b1=ri(-5,5);let m2;do{m2=ri(1,9)}while(m2===m1);const x1=ri(0,4),x2=x1+ri(1,3),b2=ri(-5,10);const y1=m2*x1+b2,y2=m2*x2+b2;const A=m1>m2?"Function A":"Function B";return mcq(`Function A: y = ${lin(m1,b1)}. Function B passes through (${x1}, ${y1}) and (${x2}, ${y2}). Which has the greater rate of change?`,A,[m1>m2?"Function B":"Function A"],"Find each slope and compare.",`A: slope ${m1}. B: (${y2}−${y1})/(${x2}−${x1}) = ${m2}.`,{js:`(${m1}>${m2})===${m1>m2}`})},
  ()=>{const m=rnz(-5,6),b=ri(-9,9),x1=ri(1,4),x2=x1+ri(1,3);const y1=m*x1+b,y2=m*x2+b;return mk("num",`A linear function passes through (${x1}, ${y1}) and (${x2}, ${y2}). What is its initial value (y-intercept)?`,b,"Find the slope, then b = y − m·x.",`m = ${(y2-y1)/(x2-x1)}; b = ${y1} − ${m}×${x1} = ${b}`,{js:`${y1}-((${y2}-${y1})/(${x2}-${x1}))*${x1}`})},
  ()=>{const a=rnz(-4,6),b=ri(-8,8),m=rnz(-4,6),c=ri(-8,8),x=ri(-4,6);return mk("num",`Function A is f(x) = ${lin(a,b)}. Function B is g(x) = ${lin(m,c)}. What is f(${x}) − g(${x})?`,(a*x+b)-(m*x+c),"Evaluate each function, then subtract.",`f(${x}) = ${a*x+b}; g(${x}) = ${m*x+c}; difference ${(a*x+b)-(m*x+c)}`,{js:`(${a}*${x}+(${b}))-(${m}*${x}+(${c}))`})}]);
T("lin-model","g8fn","8.F.4","Linear models: rate of change & initial value",["slope-int","prop-rel"],
 "A linear model y = mx + b describes a situation with a constant rate of change m and a starting (initial) value b.",
 ["m = rate of change (cost per item, speed, growth per week); b = amount when x = 0.","Total after x units: y = mx + b. To find x from y, solve mx + b = y.","From two data points find m = Δy/Δx, then b = y − mx."],
 [()=>{const F=ri(5,50),r=ri(2,12),n=ri(2,15);return mk("num",`A gym charges a $${F} sign-up fee plus $${r} per month. What is the total cost after ${n} months (dollars)?`,F+r*n,"y = rate × time + initial amount.",`${r}×${n} + ${F} = ${F+r*n}`,{js:`${F}+${r}*${n}`})},
  ()=>{const F=ri(5,50),r=ri(2,12),n=ri(2,15);return mk("num",`A gym charges a $${F} sign-up fee plus $${r} per month. After how many months have you paid $${F+r*n} in total?`,n,"Set mx + b equal to the total and solve for x.",`${r}x + ${F} = ${F+r*n} ⇒ x = ${n}`,{eqs:[`${r}*x+${F}=${F+r*n}`]})},
  ()=>{const m=ri(2,9),t1=ri(1,4),t2=t1+ri(2,5),h1=ri(3,20);return mk("num",`A plant was ${h1} cm tall after ${t1} weeks and ${h1+m*(t2-t1)} cm tall after ${t2} weeks. How many cm per week does it grow?`,m,"Rate = change in height ÷ change in time.",`(${h1+m*(t2-t1)} − ${h1})/(${t2} − ${t1}) = ${m}`,{js:`(${h1+m*(t2-t1)}-${h1})/(${t2}-${t1})`})},
  ()=>{const r=ri(2,9),t=ri(2,8),h0=ri(3,30);return mk("num",`A candle burns down ${r} cm each hour. After ${t} hours it is ${h0} cm tall. How tall was it at the start? (Burning lowers the height.)`,h0+r*t,"Initial = current + (rate × time).",`${h0} + ${r}×${t} = ${h0+r*t}`,{js:`${h0}+${r}*${t}`})},
  ()=>{const F=ri(2,30),r=ri(2,15);return mk("eq",`A taxi charges $${F} to start plus $${r} per mile. Write an equation for the cost y after x miles.`,`y = ${r}x + ${F}`,"y = (rate)x + (initial amount).",`y = ${r}x + ${F}`,{pe:`y-(${r}*x+${F})`})}]);
T("nonlin","g8fn","8.F.3","Linear vs. nonlinear functions",["func-concept","slope"],
 "A function is linear when its rate of change is constant: equal steps in x always produce equal steps in y. Otherwise it is nonlinear.",
 ["In a table with equally spaced x-values, check that the differences in y are all equal.","Linear equations look like y = mx + b: x only to the first power.","y = x², y = 1/x or y = 2ˣ are nonlinear."],
 [()=>{const lin_=Math.random()<0.5;const m=rnz(-4,5),b=ri(-5,8);const ys=[0,1,2,3].map(i=>lin_?m*i+b:i*i*(m>0?1:-1)+b);return mcq(`Is the function with x = 0, 1, 2, 3 and y = ${ys.join(", ")} linear?`,lin_?"Yes":"No",[lin_?"No":"Yes"],"Check whether the y-differences are constant.",`differences: ${ys[1]-ys[0]}, ${ys[2]-ys[1]}, ${ys[3]-ys[2]}`,{js:`(${ys[1]-ys[0]}===${ys[2]-ys[1]}&&${ys[2]-ys[1]}===${ys[3]-ys[2]})===${lin_}`})},
  ()=>{const c=pick([["y = 3x − 2","Linear"],["y = x^2 + 1","Nonlinear"],["y = 4/x","Nonlinear"],["y = 5","Linear"],["y = 2^x","Nonlinear"],["y = −x/2 + 7","Linear"],["y = x^3","Nonlinear"],["3x + 4y = 12","Linear"]]);return mcq(`Is ${c[0]} linear or nonlinear?`,c[1],[c[1]==="Linear"?"Nonlinear":"Linear"],"Linear equations have x and y to the first power only.",c[1]==="Linear"?"It can be written as y = mx + b.":"The variable is squared, cubed, in a denominator, or in an exponent.")},
  ()=>{const m=rnz(-5,6),b=ri(-6,8);const ys=[0,1,2,3].map(i=>m*i+b);return mk("num",`The table is linear: x = 0, 1, 2, 3 and y = ${ys[0]}, ${ys[1]}, ?, ${ys[3]}. Find the missing y-value.`,ys[2],"A linear function has a constant difference between consecutive y-values.",`difference = ${ys[1]-ys[0]}; ${ys[1]} + ${ys[1]-ys[0]} = ${ys[2]}`,{js:`${b}+2*(${ys[1]}-${ys[0]})`})}]);
const TR=(q,ans,eqs,rule,work)=>mk("pair",q,ans,rule,work,{eqs});
T("translate","g8tr","8.G.3","Translations",["int-addsub"],
 "A translation slides every point of a figure the same distance in the same direction. Add the horizontal shift to x and the vertical shift to y.",
 ["Rule: (x, y) → (x + a, y + b). Right/up are positive, left/down negative.","Translations preserve side lengths, angles and orientation, so the image is congruent.","To find the shift, subtract: (a, b) = (x′ − x, y′ − y)."],
 [()=>{const x=ri(-8,8),y=ri(-8,8),a=rnz(-6,6),b=rnz(-6,6);return TR(`Translate the point (${x}, ${y}) by the rule (x, y) → (x ${a<0?"-":"+"} ${Math.abs(a)}, y ${b<0?"-":"+"} ${Math.abs(b)}). What is the image?`,`(${x+a}, ${y+b})`,[`x=${x}+(${a})`,`y=${y}+(${b})`],"Add the shifts to the coordinates.",`(${x}${a<0?"-":"+"}${Math.abs(a)}, ${y}${b<0?"-":"+"}${Math.abs(b)}) = (${x+a}, ${y+b})`)},
  ()=>{const x=ri(-8,8),y=ri(-8,8),a=rnz(-7,7),b=rnz(-7,7);return TR(`A point A(${x}, ${y}) is translated to A′(${x+a}, ${y+b}). Find the translation as an ordered pair (horizontal shift, vertical shift).`,`(${a}, ${b})`,[`x=${x+a}-(${x})`,`y=${y+b}-(${y})`],"Shift = image − original in each coordinate.",`${x+a} − ${P(x)} = ${a}; ${y+b} − ${P(y)} = ${b}`)},
  ()=>{const h=ri(1,7),v=ri(1,7),x=ri(-6,6),y=ri(-6,6),d1=pick(["left","right"]),d2=pick(["up","down"]);const dx=d1==="left"?-h:h,dy=d2==="up"?v:-v;return TR(`Translate the point (${x}, ${y}) ${h} units ${d1} and ${v} units ${d2}. What is the image?`,`(${x+dx}, ${y+dy})`,[`x=${x}+(${dx})`,`y=${y}+(${dy})`],"Left/down subtract; right/up add.",`x: ${x} ${dx<0?"−":"+"} ${h} = ${x+dx}; y: ${y} ${dy<0?"−":"+"} ${v} = ${y+dy}`)},
  ()=>{const A=[ri(-5,5),ri(-5,5)],a=rnz(-5,5),b=rnz(-5,5),B=[A[0]+ri(1,5),A[1]+ri(-4,4)];return TR(`Triangle vertex B is at (${B[0]}, ${B[1]}). The triangle is translated so that A(${A[0]}, ${A[1]}) moves to A′(${A[0]+a}, ${A[1]+b}). Where does B go?`,`(${B[0]+a}, ${B[1]+b})`,[`x=${B[0]}+(${a})`,`y=${B[1]}+(${b})`],"Every point moves by the same shift: find it from A → A′, then apply it to B.",`shift = (${a}, ${b}); B′ = (${B[0]+a}, ${B[1]+b})`)}]);
T("reflect","g8tr","8.G.3","Reflections",["translate"],
 "A reflection flips a figure over a line (the mirror). Each point and its image are the same distance from the line, on opposite sides.",
 ["Over the x-axis: (x, y) → (x, −y).  Over the y-axis: (x, y) → (−x, y).","Over the line y = x: (x, y) → (y, x).","Over a vertical line x = k: x → 2k − x (y unchanged); over y = k: y → 2k − y."],
 [()=>{const x=rnz(-8,8),y=rnz(-8,8);return TR(`Reflect (${x}, ${y}) over the x-axis.`,`(${x}, ${-y})`,[`x=${x}`,`(y+(${y}))/2=0`],"Over the x-axis the y-coordinate changes sign.",`(${x}, −${P(y)}) = (${x}, ${-y})`)},
  ()=>{const x=rnz(-8,8),y=rnz(-8,8);return TR(`Reflect (${x}, ${y}) over the y-axis.`,`(${-x}, ${y})`,[`y=${y}`,`(x+(${x}))/2=0`],"Over the y-axis the x-coordinate changes sign.",`(−${P(x)}, ${y}) = (${-x}, ${y})`)},
  ()=>{const x=ri(-8,8),y=ri(-8,8);return TR(`Reflect (${x}, ${y}) over the line y = x.`,`(${y}, ${x})`,[`x+y=${x}+(${y})`,`x-y=-(${x})+(${y})`],"Reflecting over y = x swaps the coordinates.",`(${x}, ${y}) → (${y}, ${x})`)},
  ()=>{const x=ri(-8,8),y=ri(-8,8),k=ri(-5,5);return TR(`Reflect (${x}, ${y}) over the vertical line x = ${k}.`,`(${2*k-x}, ${y})`,[`(x+(${x}))/2=${k}`,`y=${y}`],"New x = 2k − x; y stays the same.",`2(${k}) − ${P(x)} = ${2*k-x}`)},
  ()=>{const x=ri(-8,8),y=ri(-8,8),k=ri(-5,5);return TR(`Reflect (${x}, ${y}) over the horizontal line y = ${k}.`,`(${x}, ${2*k-y})`,[`x=${x}`,`(y+(${y}))/2=${k}`],"New y = 2k − y; x stays the same.",`2(${k}) − ${P(y)} = ${2*k-y}`)}]);
T("rotate","g8tr","8.G.3","Rotations about the origin",["reflect"],
 "A rotation turns a figure about a fixed point (here the origin) through a given angle. Counterclockwise is the positive direction.",
 ["90° counterclockwise: (x, y) → (−y, x).","180°: (x, y) → (−x, −y).   270° counterclockwise (= 90° clockwise): (x, y) → (y, −x).","Rotations preserve distance from the origin and the shape of the figure."],
 [()=>{const a=rnz(-8,8),b=rnz(-8,8);return TR(`Rotate (${a}, ${b}) 90° counterclockwise about the origin.`,`(${-b}, ${a})`,[`x*${a}+y*${b}=0`,`x*(${b})-y*(${a})=-(${a*a+b*b})`],"90° counterclockwise: (x, y) → (−y, x).",`(−${P(b)}, ${a}) = (${-b}, ${a})`)},
  ()=>{const a=rnz(-8,8),b=rnz(-8,8);return TR(`Rotate (${a}, ${b}) 180° about the origin.`,`(${-a}, ${-b})`,[`x=-(${a})`,`y=-(${b})`],"180°: both coordinates change sign.",`(−${P(a)}, −${P(b)}) = (${-a}, ${-b})`)},
  ()=>{const a=rnz(-8,8),b=rnz(-8,8);return TR(`Rotate (${a}, ${b}) 270° counterclockwise about the origin.`,`(${b}, ${-a})`,[`x*${a}+y*${b}=0`,`x*(${b})-y*(${a})=${a*a+b*b}`],"270° counterclockwise: (x, y) → (y, −x).",`(${b}, −${P(a)}) = (${b}, ${-a})`)},
  ()=>{const a=rnz(-8,8),b=rnz(-8,8);return TR(`Rotate (${a}, ${b}) 90° clockwise about the origin.`,`(${b}, ${-a})`,[`x*${a}+y*${b}=0`,`x*(${b})-y*(${a})=${a*a+b*b}`],"90° clockwise is the same as 270° counterclockwise: (x, y) → (y, −x).",`(${b}, −${P(a)}) = (${b}, ${-a})`)}]);
T("dilate","g8tr","8.G.3","Dilations",["translate","frac-muldiv"],
 "A dilation enlarges or shrinks a figure by a scale factor k from a center (here the origin). The image is similar to the original.",
 ["Rule from the origin: (x, y) → (kx, ky).  k > 1 enlarges; 0 < k < 1 shrinks.","Lengths multiply by k; areas multiply by k².","Scale factor = image length ÷ original length."],
 [()=>{const x=rnz(-6,6),y=rnz(-6,6),k=ri(2,5);return TR(`Dilate (${x}, ${y}) by scale factor ${k} from the origin.`,`(${k*x}, ${k*y})`,[`x=${k}*(${x})`,`y=${k}*(${y})`],"Multiply both coordinates by k.",`(${k}×${P(x)}, ${k}×${P(y)}) = (${k*x}, ${k*y})`)},
  ()=>{const d=ri(2,4),x=d*rnz(-4,4),y=d*rnz(-4,4);return TR(`Dilate (${x}, ${y}) by scale factor 1/${d} from the origin.`,`(${x/d}, ${y/d})`,[`x=(${x})/${d}`,`y=(${y})/${d}`],"A scale factor below 1 shrinks: divide the coordinates.",`(${x}/${d}, ${y}/${d}) = (${x/d}, ${y/d})`)},
  ()=>{const k=pick([2,3,4,5,[1,2],[1,3],[2,3],[3,2]]);const kn=Array.isArray(k)?k[0]:k,kd=Array.isArray(k)?k[1]:1;const L=kd*ri(2,6);const L2=L*kn/kd;return mk("num",`A segment of length ${L} is dilated and its image has length ${L2}. What is the scale factor?`,frs(kn,kd),"Scale factor = image length ÷ original length.",`${L2}/${L} = ${frs(kn,kd)}`,{js:`${L2}/${L}`})},
  ()=>{const A=ri(2,12),k=ri(2,5);return mk("num",`A triangle with area ${A} is dilated by scale factor ${k}. What is the area of the image?`,A*k*k,"Areas scale by k².",`${A} × ${k}² = ${A*k*k}`,{js:`${A}*${k}**2`})}]);
T("transform-seq","g8tr","8.G.2","Sequences of transformations & congruence",["rotate","dilate"],
 "Two figures are congruent if a sequence of translations, reflections and rotations maps one onto the other; they are similar if dilations are also allowed. Apply the steps in order.",
 ["Work one transformation at a time, using the image of the first as the input of the second.","Rigid motions (translation, reflection, rotation) keep lengths and angles; dilations keep angles but change lengths.","Orientation can flip: a reflection reverses it."],
 [()=>{const x=ri(-6,6),y=ri(-6,6),a=rnz(-5,5),b=rnz(-5,5);return TR(`Reflect (${x}, ${y}) over the x-axis, then translate by (${a}, ${b}). What is the final image?`,`(${x+a}, ${-y+b})`,[`x=${x}+(${a})`,`y=-(${y})+(${b})`],"Apply the reflection first, then the translation.",`reflect: (${x}, ${-y}); translate: (${x+a}, ${-y+b})`)},
  ()=>{const x=rnz(-6,6),y=rnz(-6,6);return TR(`Rotate (${x}, ${y}) 90° counterclockwise about the origin, then reflect over the y-axis. What is the final image?`,`(${y}, ${x})`,[`x=${y}`,`y=${x}`],"Rotate: (x, y) → (−y, x); reflect over the y-axis: negate x.",`rotate: (${-y}, ${x}); reflect: (${y}, ${x})`)},
  ()=>{const x=rnz(-5,5),y=rnz(-5,5),k=ri(2,4),a=rnz(-5,5),b=rnz(-5,5);return TR(`Dilate (${x}, ${y}) by scale factor ${k} from the origin, then translate by (${a}, ${b}). What is the final image?`,`(${k*x+a}, ${k*y+b})`,[`x=${k}*(${x})+(${a})`,`y=${k}*(${y})+(${b})`],"Dilate first, then translate.",`dilate: (${k*x}, ${k*y}); translate: (${k*x+a}, ${k*y+b})`)},
  ()=>{const q=pick([["Translation","Dilation (scale factor 2)",true],["Reflection","Dilation (scale factor 1/2)",true],["Rotation","Dilation (scale factor 3)",true]]);return mcq(`Which transformation does NOT preserve side lengths (so it does not always produce a congruent figure)?`,q[1],["Translation","Reflection","Rotation"],"Rigid motions preserve distance; dilations (k ≠ 1) do not.","A dilation by k multiplies every length by k.")}]);
T("angles-parallel","g8tr","8.G.5","Parallel lines cut by a transversal",["angle-rel"],
 "When a transversal crosses two parallel lines, the eight angles form equal and supplementary pairs.",
 ["Equal: corresponding, alternate interior, alternate exterior and vertical angles.","Supplementary (sum 180°): same-side (co-)interior angles and linear pairs.","With algebra, set equal or set the sum to 180°, and solve for x."],
 [()=>{const a=ri(40,140);const r=pick([["corresponding",a],["alternate interior",a],["alternate exterior",a],["vertical",a],["same-side interior",180-a]]);return mk("num",`Two parallel lines are cut by a transversal. One angle measures ${a}°. What is the measure of its ${r[0]} angle?`,r[1],r[0]==="same-side interior"?"Same-side interior angles are supplementary.":`${r[0][0].toUpperCase()+r[0].slice(1)} angles are equal.`,`${r[0]} angle = ${r[1]}°`,{js:`${r[0]==="same-side interior"?`180-${a}`:a}`,u:"°"})},
  ()=>{const x0=ri(8,30),a=ri(2,5);let c;do{c=ri(1,4)}while(c===a);const b=ri(0,20),d=(a-c)*x0+b;if(d<0)return TOPIC_BY_ID["angles-parallel"].gens[1]();return mk("num",`Parallel lines are cut by a transversal. Two alternate interior angles measure (${lin(a,b)})° and (${lin(c,d)})°. Find x.`,x0,"Alternate interior angles are equal.",`${lin(a,b)} = ${lin(c,d)} ⇒ x = ${x0}`,{eqs:[`${a}*x+${b}=${c}*x+${d}`]})},
  ()=>{let a,c,b,d,x0;do{x0=ri(8,25);a=ri(1,4);c=ri(1,4);b=ri(0,25);d=180-(a+c)*x0-b}while(d<0);return mk("num",`Parallel lines are cut by a transversal. Two same-side interior angles measure (${lin(a,b)})° and (${lin(c,d)})°. Find x.`,x0,"Same-side interior angles add to 180°.",`${lin(a,b)} + ${lin(c,d)} = 180 ⇒ ${a+c}x = ${180-b-d} ⇒ x = ${x0}`,{eqs:[`${a}*x+${b}+${c}*x+${d}=180`]})},
  ()=>{const a=ri(35,80);return mk("num",`Lines p and q are parallel. A transversal makes a ${a}° angle with p. Another angle on the same side, forming a linear pair with the angle corresponding to it on q, measures how many degrees?`,180-a,"The corresponding angle on q is also "+a+"°; a linear pair adds to 180°.",`180 − ${a} = ${180-a}`,{js:`180-${a}`,u:"°"})}]);
T("scatter","g8sp","8.SP.1","Scatterplots, association & lines of fit",["slope-int","stat-center"],
 "A scatterplot shows two variables. If y tends to rise as x rises the association is positive; if it falls, negative; if there is no pattern, none. A line of fit models the trend.",
 ["Positive association: points trend up to the right; negative: down to the right.","Use the line y = mx + b to predict: substitute x.","Residual = actual y − predicted y. The slope is the predicted change in y per 1 unit of x."],
 [()=>{const d=pick(["pos","neg","none"]);let xs,ys,r;for(let t=0;t<200;t++){xs=Array.from({length:8},(_,i)=>i+1);const s=d==="pos"?ri(2,4):d==="neg"?-ri(2,4):0;ys=xs.map(x=>10+s*x+ri(-3,3)*(d==="none"?4:1));const mx=xs.reduce((a,b)=>a+b)/8,my=ys.reduce((a,b)=>a+b)/8;let sxy=0,sxx=0,syy=0;xs.forEach((x,i)=>{sxy+=(x-mx)*(ys[i]-my);sxx+=(x-mx)**2;syy+=(ys[i]-my)**2});r=syy?sxy/Math.sqrt(sxx*syy):0;if((d==="pos"&&r>0.8)||(d==="neg"&&r<-0.8)||(d==="none"&&Math.abs(r)<0.3))break}
     const ans=d==="pos"?"Positive association":d==="neg"?"Negative association":"No association";const pts=xs.map((x,i)=>`(${x}, ${ys[i]})`).join(" ");return mcq(`Points of a scatterplot: ${pts}. What kind of association does it show?`,ans,["Positive association","Negative association","No association"].filter(x=>x!==ans),"Look at the overall trend of y as x increases.",d==="pos"?"y generally increases as x increases.":d==="neg"?"y generally decreases as x increases.":"There is no consistent trend.")},
  ()=>{const m=pick([1.5,2,2.5,3,0.5,-1,-2,4]),b=ri(-5,30),x=ri(2,12);return mk("num",`A line of fit is y = ${m}x + ${b}`.replace("+ -","- ")+`. Predict y when x = ${x}.`,rdn(m*x+b,3),"Substitute x into the equation.",`${m}×${x} + ${b} = ${rdn(m*x+b,3)}`,{js:`${m}*${x}+${b}`})},
  ()=>{const m=pick([2,3,4,5,1.5,2.5]);return mk("num",`A line of fit for study time x (hours) and score y is y = ${m}x + 52. By how many points does the model predict the score rises for each extra hour?`,m,"The slope is the change in y per 1 unit of x.",`slope = ${m}`,{js:`${m}`})},
  ()=>{const m=ri(2,5),b=ri(5,25),x=ri(2,10),act=m*x+b+ri(-6,6);if(act===m*x+b)return TOPIC_BY_ID["scatter"].gens[3]();return mk("num",`The line of fit is y = ${m}x + ${b}. A data point is (${x}, ${act}). What is the residual (actual − predicted)?`,act-(m*x+b),"Residual = actual y − predicted y.",`predicted = ${m*x+b}; ${act} − ${m*x+b} = ${act-(m*x+b)}`,{js:`${act}-(${m}*${x}+${b})`})}]);
T("two-way","g8sp","8.SP.4","Two-way tables & relative frequency",["prob-simple","percent"],
 "A two-way table counts how many people fall in each combination of two categories. Relative frequencies compare a count to a total.",
 ["Relative frequency = count ÷ total (the grand total, a row total, or a column total depending on the question).","Joint: both categories. Marginal: one category's total.","Conditional: restrict to one group first, then take the fraction within it."],
 [()=>{const a=ri(5,20),b=ri(5,20),c=ri(5,20),d=ri(5,20),N=a+b+c+d;return mk("num",`Boys: ${a} like pizza and ${b} do not. Girls: ${c} like pizza and ${d} do not. What fraction of all students are boys who like pizza?`,frs(a,N),"Joint relative frequency = cell ÷ grand total.",`${a}/${N} = ${frs(a,N)}`,{js:`${a}/${a+b+c+d}`})},
  ()=>{const a=ri(5,20),b=ri(5,20),c=ri(5,20),d=ri(5,20),N=a+b+c+d;return mk("num",`Boys: ${a} like pizza and ${b} do not. Girls: ${c} like pizza and ${d} do not. What fraction of all students like pizza?`,frs(a+c,N),"Marginal relative frequency = column total ÷ grand total.",`(${a}+${c})/${N} = ${frs(a+c,N)}`,{js:`(${a}+${c})/${a+b+c+d}`})},
  ()=>{const a=ri(5,20),b=ri(5,20),c=ri(5,20),d=ri(5,20);return mk("num",`Boys: ${a} like pizza and ${b} do not. Girls: ${c} like pizza and ${d} do not. Among the girls, what fraction like pizza?`,frs(c,c+d),"Conditional: use only the girls as the total.",`${c}/(${c}+${d}) = ${frs(c,c+d)}`,{js:`${c}/(${c}+${d})`})},
  ()=>{const a=ri(2,10)*2,b=ri(2,10)*2,c=ri(2,10)*2,d=ri(2,10)*2,N=a+b+c+d;const pct=100*(a+b)/N;return mk("num",`In a survey, ${a} teens and ${c} adults said yes; ${b} teens and ${d} adults said no. What percent of the people surveyed are teens? (Round to the nearest tenth.)`,rdn(pct,1),"Teens ÷ total × 100.",`(${a}+${b})/${N} × 100 = ${rdn(pct,1)}%`,{u:"%",js:`(${a}+${b})/${a+b+c+d}*100`,jtol:0.0500001})}]);
T("cyl-cone-sph","g8tr","8.G.9","Volume of cylinders, cones & spheres",["vol-prism","circle-basic","exp-prod"],
 "These round solids use π. A cone is one third of the cylinder with the same base and height, and a sphere's volume depends only on its radius.",
 ["Cylinder: V = πr²h.   Cone: V = ⅓πr²h.   Sphere: V = ⁴⁄₃πr³.","Use the radius (half the diameter!).","Leave answers in terms of π (type pi) unless told to round."],
 [()=>{const r=ri(2,9),h=ri(2,12);return mk("expr",`Find the volume of a cylinder with radius ${r} and height ${h}. Leave the answer in terms of π.`,`${r*r*h}pi`,"V = πr²h.",`π × ${r}² × ${h} = ${r*r*h}π`,{pe:`Math.PI*${r}**2*${h}`})},
  ()=>{const r=ri(2,9),m=ri(1,5);const h=3*m;return mk("expr",`Find the volume of a cone with radius ${r} and height ${h}. Leave the answer in terms of π.`,`${r*r*m}pi`,"V = ⅓πr²h.",`⅓ × π × ${r}² × ${h} = ${r*r*m}π`,{pe:`Math.PI*${r}**2*${h}/3`})},
  ()=>{const r=ri(1,8);const n=4*r*r*r;const c=n%3===0?`${n/3}pi`:`(${n}/3)pi`;return mk("expr",`Find the volume of a sphere with radius ${r}. Leave the answer in terms of π.`,c,"V = ⁴⁄₃πr³.",`⁴⁄₃ × π × ${r}³ = ${c}`,{pe:`4/3*Math.PI*${r}**3`})},
  ()=>{const r=ri(2,8),h=ri(2,12);return mk("num",`A cylinder has volume ${r*r*h}π and radius ${r}. What is its height?`,h,"V = πr²h, so h = V ÷ (πr²).",`${r*r*h}π ÷ (π×${r*r}) = ${h}`,{js:`${r*r*h}/(${r}**2)`})},
  ()=>{const d=2*ri(2,8),h=ri(2,10);return mk("num",`A can has diameter ${d} and height ${h}. Using π = 3.14, find its volume (round to the nearest hundredth).`,rdn(3.14*(d/2)**2*h,2),"Radius = diameter ÷ 2; then V = πr²h.",`r = ${d/2}; 3.14 × ${(d/2)**2} × ${h} = ${rdn(3.14*(d/2)**2*h,2)}`,{js:`3.14*(${d}/2)**2*${h}`})}]);

// ===== Algebra I (rest) =====
addUnits("a1",[["a1ineq","Inequalities"],["a1fn","Functions & Rates of Change"],["a1seq","Sequences & Exponential Functions"],["a1poly","Polynomials & Factoring"],["a1quad","Quadratic Functions & Equations"],["a1rad","Radicals & Real Numbers"],["a1stat","Statistics & Data"]]);
const bf=(m,p)=>"("+lin(m,p)+")";
const rparts=n=>{let k=1,m=n;for(let f=2;f*f<=m;f++)while(m%(f*f)===0){m/=f*f;k*=f}return [k,m]};
const rs=(c,n)=>{const [k,m]=rparts(n);const cc=c*k;return m===1?String(cc):(cc===1?"":cc===-1?"-":cc)+"sqrt("+m+")"};
const cmpSym={"<":"<",">":">","<=":"≤",">=":"≥"};
const flip=o=>({"<":">",">":"<","<=":">=",">=":"<="}[o]);
const IVL=(a,ac,b,bc)=>`${ac?"[":"("}${a}, ${b}${bc?"]":")"}`;
T("abs-eq","a1eq","A.REI.3","Absolute value equations",["multistep-eq","abs-opp"],
 "The equation |A| = r asks for numbers whose distance from 0 is r, so A = r or A = −r. Solve both equations.",
 ["Isolate the absolute value first: |x| + 3 = 8 → |x| = 5.","Split: |A| = r (r > 0) means A = r or A = −r. Two solutions are possible.","|A| = negative number has no solution; type none."],
 [()=>{const q=rnz(-9,9),r=ri(1,9);return mk("set",`Solve: |x + ${q}| = ${r}`.replace("+ -","- "),`${-q+r}, ${-q-r}`,"Split into x + q = r and x + q = −r.",`x ${q<0?"-":"+"} ${Math.abs(q)} = ${r} → x = ${-q+r}; x ${q<0?"-":"+"} ${Math.abs(q)} = ${-r} → x = ${-q-r}`,{fx:`Math.abs(x+(${q}))-${r}`,nroots:2})},
  ()=>{const a=ri(2,4),x1=ri(-3,6),d=ri(1,4);const b=-a*(x1-d),r=a*d;return mk("set",`Solve: |${lin(a,b)}| = ${r}`,`${x1}, ${x1-2*d}`,"Write ax + b = r and ax + b = −r.",`${lin(a,b)} = ${r} → x = ${x1}; ${lin(a,b)} = ${-r} → x = ${x1-2*d}`,{fx:`Math.abs(${a}*x+(${b}))-${r}`,nroots:2})},
  ()=>{const c=ri(1,9),d=c+ri(1,9);return mk("set",`Solve: |x| + ${c} = ${d}`,`${-(d-c)}, ${d-c}`,"Isolate |x| first, then split.",`|x| = ${d} − ${c} = ${d-c}, so x = ±${d-c}`,{fx:`Math.abs(x)+${c}-${d}`,nroots:2})},
  ()=>{const q=rnz(-8,8),k=ri(1,9);return mk("set",`Solve: |x + ${q}| = -${k}`.replace("+ -","- "),"none","An absolute value can never be negative.",`|anything| ≥ 0, so |x ${q<0?"−":"+"} ${Math.abs(q)}| = −${k} has no solution`,{fx:`Math.abs(x+(${q}))+${k}`})}]);
T("ineq-multi","a1ineq","A.REI.3","Multi-step inequalities",["ineq","multistep-eq"],
 "Solve inequalities like equations, with one big rule: when you multiply or divide both sides by a negative number, the inequality sign flips.",
 ["Collect variable terms on one side and constants on the other.","Multiplying/dividing by a negative reverses the sign: −2x > 6 → x < −3.","Answer like x > 3 or x <= -2."],
